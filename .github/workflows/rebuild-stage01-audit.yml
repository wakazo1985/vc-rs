name: Rebuild stage 01 public model metadata audit
on:
  push:
    branches: [rebuild-stage01-audit]
    paths: ['.github/workflows/rebuild-stage01-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect public sources without copying model weights into repository
        shell: bash
        run: |
          python - <<'PY'
          import io, json, struct, zipfile, urllib.request, re, pickletools, zlib, collections, math, pickle
          from urllib.parse import quote
          def get(url, start=None, end=None):
              headers = {"User-Agent":"RVC-stage01-metadata-audit/1.0","Accept-Encoding":"identity"}
              if start is not None: headers["Range"]=f"bytes={start}-{end}"
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=25) as r:
                  if start is not None and r.status != 206: raise ValueError("Range unsupported; full download forbidden")
                  return r.read(8*1024*1024+1), r.headers
          class Remote(io.RawIOBase):
              def __init__(self,url):
                  self.url=url; self.pos=0; self.transferred=0
                  _,h=get(url,0,0)
                  self.size=int(h["Content-Range"].split("/")[-1])
              def readable(self): return True
              def seekable(self): return True
              def tell(self): return self.pos
              def seek(self,off,whence=0):
                  self.pos=off if whence==0 else self.pos+off if whence==1 else self.size+off
                  return self.pos
              def read(self,n=-1):
                  n=self.size-self.pos if n<0 else min(n,self.size-self.pos)
                  if n<=0: return b""
                  if n>8*1024*1024 or self.transferred+n>16*1024*1024: raise ValueError("metadata transfer limit")
                  data,h=get(self.url,self.pos,self.pos+n-1)
                  if len(data)!=n: raise ValueError("invalid range response")
                  self.pos+=n; self.transferred+=n
                  return data
          class MetadataOnly(pickle.Unpickler):
              def find_class(self,module,name):
                  if (module,name)==("collections","OrderedDict"): return collections.OrderedDict
                  if module=="torch" and name in ("HalfStorage","FloatStorage","DoubleStorage","LongStorage","IntStorage","BoolStorage","ByteStorage","BFloat16Storage","ShortStorage","CharStorage"): return name
                  if module=="torch._utils" and name in ("_rebuild_tensor","_rebuild_tensor_v2","_rebuild_tensor_v3"):
                      return lambda storage,offset,size,stride,*args: {"shape":list(size),"stride":list(stride),"storage":storage,"offset":offset}
                  if module=="torch._utils" and name in ("_rebuild_parameter","_rebuild_parameter_with_state"): return lambda data,*args:data
                  raise ValueError("Unrecognized pickle global "+module+"."+name)
              def persistent_load(self,pid):
                  if not isinstance(pid,tuple) or len(pid)<5 or pid[0]!="storage": raise ValueError("Unsupported persistent id")
                  return {"dtype":pid[1],"storage_id":pid[2],"device":pid[3],"size":pid[4]}
          def pth_meta(f):
              head=f.read(30)
              if head[:4]!=b"PK\x03\x04": raise ValueError("Non ZIP checkpoint")
              sig,ver,flag,comp,mt,md,crc,cs,us,nl,xl=struct.unpack("<4s5H3I2H",head)
              name=f.read(nl).decode("utf-8","replace"); f.read(xl)
              if not name.endswith("data.pkl"): raise ValueError("Unexpected checkpoint record "+name)
              if comp==0: buf=f.read(min(cs or 1048576,1048576))
              elif comp==8: buf=zlib.decompressobj(-15).decompress(f.read(min(cs or 1048576,1048576)),1048576)
              else: raise ValueError("Unsupported compression")
              # Only allow inert tensor descriptors, never instantiate torch modules or load storage.
              data=MetadataOnly(io.BytesIO(buf)).load()
              w=data.get("weight",{})
              meta={k:v for k,v in data.items() if k!="weight"}
              print("FULL_META",json.dumps(meta,ensure_ascii=False,default=str))
              print("TENSOR_COUNT",len(w),"PARAM_COUNT",sum(math.prod(v["shape"]) for v in w.values() if isinstance(v,dict) and "shape" in v))
              print("TENSOR_GROUPS",json.dumps(dict(collections.Counter(k.split(".")[0] for k in w))))
              print("KEY_SHAPES",json.dumps({k:v for k,v in w.items() if k in ("emb_g.weight","enc_p.emb_phone.weight","enc_p.emb_pitch.weight","dec.conv_pre.weight","dec.conv_pre.weight_v","dec.conv_post.weight","dec.m_source.l_linear.weight") or re.search(r"^dec\\.ups\\.\\d+\\.(weight_v|weight|parametrizations.weight.original1)$",k)},default=str))
              print("DECODER_KEYS",json.dumps([k for k in w if k.startswith("dec.")][:30]))
          def inspect_index(f):
              h=f.read(57)
              magic,d,n,dummy1,dummy2,trained,metric=struct.unpack_from("<4siqqq?i",h)
              if magic!=b"IwFl" or metric not in (0,1): raise ValueError("Unsupported header")
              nlist,nprobe,quantizer=struct.unpack_from("<QQ4s",h,37)
              print("INDEX_META",json.dumps({"type":"IndexIVFFlat","dimension":d,"vectors":n,"trained":trained,"metric":("inner_product","squared_L2")[metric],"nlist":nlist,"nprobe":nprobe,"quantizer_magic":quantizer.decode(),"bytes_per_vector":4*d+8}))
          sources=[
              ("toddler","https://huggingface.co/VofVoices/maxwell-young-fantastic-max-RVC-v2/resolve/main/"+quote("maxwellyoung(FantasticMax).zip"),160446052),
              ("girl","https://amitaro.net/download/others/rvc_amitaro_runrun_1.0.zip",365440882),
              ("robot original-name candidate","https://huggingface.co/analogspiderweb/analogspiderweb_RVC/resolve/17a331f0ecdc9cbb52b0b7d599b36300a38fc413/speakandspell.zip",96253214),
          ]
          for name,url,expected in sources:
              print("\nSOURCE",name,url)
              try:
                  r=Remote(url)
                  print("public archive bytes",r.size,"library size match",r.size==expected,"not proof of identity")
                  with zipfile.ZipFile(r) as z:
                      for item in z.infolist():
                          print("ENTRY",repr(item.filename),item.file_size,"CRC32",format(item.CRC,"08x"))
                      for item in z.infolist():
                          ext=item.filename.lower().rsplit(".",1)[-1]
                          if ext in ("txt","md","json") and item.file_size<=65536:
                              with z.open(item) as f: print("README_PRESENT",item.filename,item.file_size)
                          elif ext=="pth":
                              with z.open(item) as f: pth_meta(f)
                          elif ext=="index":
                              with z.open(item) as f: inspect_index(f)
                  print("range bytes read",r.transferred)
              except Exception as e: print("FAILED",name,type(e).__name__,str(e))
          for folder in ("D",):
              url="https://huggingface.co/api/models/ttttdiva/rvc_okiba/tree/main/models/"+folder
              print("\nMALE CANDIDATE",folder)
              try:
                  raw,_=get(url); entries=json.loads(raw)
                  for e in entries:
                      print("FILE",e.get("path"),e.get("size"),"sha256",e.get("lfs",{}).get("oid"))
                      if e.get("size")==55232523 and str(e.get("path","")).endswith(".pth"):
                          r=Remote("https://huggingface.co/ttttdiva/rvc_okiba/resolve/main/"+quote(e["path"],safe="/")); pth_meta(r)
                      if e.get("size")==454130739 and str(e.get("path","")).endswith(".index"):
                          r=Remote("https://huggingface.co/ttttdiva/rvc_okiba/resolve/main/"+quote(e["path"],safe="/")); inspect_index(r)
              except Exception as e: print("FAILED",folder,type(e).__name__,str(e))
          print("Public-source metadata only. User archive hashes and exact identity remain unverified. No model conversion or artifact publication.")
          PY
