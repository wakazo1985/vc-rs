name: VoiceBank Windows native generator
on:
  push:
    branches: [voicebank-native-generator]
    paths: ['tools/voicebank-libtorch/**', '.github/workflows/voicebank-native-generator.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: RVC-Project/Retrieval-based-Voice-Conversion-WebUI
          ref: 81eed5e8f68b6bed1789f682fe78cdd324495afc
          path: upstream/rvc
      - uses: actions/checkout@v4
        with:
          repository: IAHispano/Applio
          ref: b04a24baec709cbfac1e4bb9e960dde730906b62
          path: upstream/applio
      - name: Install build and test dependencies
        run: |
          python -m pip install torch==2.7.1 torchaudio==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install numpy==2.2.6 scipy==1.15.3
      - name: Build native Windows DLL
        run: |
          $prefix = python -c "import torch; print(torch.utils.cmake_prefix_path)"
          cmake -S tools/voicebank-libtorch -B build -A x64 "-DCMAKE_PREFIX_PATH=$prefix"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel 2
      - name: Verify all architectures against official inference
        run: |
          New-Item -ItemType Directory -Path native
          Copy-Item build/Release/voicebank_generator.dll native
          foreach ($variant in @('rvc-40000','applio-40000','applio-48000')) {
            $engine,$rate = $variant.Split('-')
            $arch = "native/$variant.pt"
            python tools/voicebank-libtorch/build_architecture.py $engine "upstream/$engine" $rate 16 $arch
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            python tools/voicebank-libtorch/check_native.py $engine "upstream/$engine" $arch native/voicebank_generator.dll
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: voicebank-native-generator-windows-x64-development
          path: native
          compression-level: 9
