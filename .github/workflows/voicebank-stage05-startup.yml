name: VoiceBank 05 startup and common model tests
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/voicebank-stage05-startup.yml'
      - 'crates/vc-vst3/src/runtime.rs'
      - 'crates/vc-core/src/model_rvc/sessions.rs'
permissions:
  contents: read
env:
  VC_RS_ENABLE_NATIVE_TENSORRT: "0"
  CARGO_TERM_COLOR: never
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          cargo test -p vc-core --no-default-features --features tensorrt --locked --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p vc-vst3 --no-default-features --features tensorrt --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
