name: Stage 04 native core 20ms gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/stage04-native-core-20ms.yml'
  push:
    branches: [stage01-python-verification]
    paths:
      - '.github/workflows/stage04-native-core-20ms.yml'
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: VoiceBank-Stage03-Frozen
          path: frozen
          github-token: ${{ github.token }}
          run-id: '46134456010'
      - name: Acquire exact original checkpoints and indices
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libopenblas-dev libssl-dev
          curl --fail --location --retry 3 https://raw.githubusercontent.com/pytorch/pytorch/v2.7.1/torch/csrc/jit/serialization/unpickler.cpp -o unpickler.cpp
          python - <<'PATCH'
          from pathlib import Path
          p=Path('unpickler.cpp')
          s=p.read_text()
          marker='} else if (module_name == "collections" && class_name == "OrderedDict") {'
          start=s.index(marker)
          end=s.index('} else if (module_name == "torch" && class_name == "device") {',start)
          old=s[start:end]
          assert 'stack_.back() = IValue();' in old
          # Preserve actual OrderedDict keys and insertion order in the native dict.
          s=s[:start]+old.replace('stack_.back() = IValue();','TORCH_CHECK(stack_.back().isTuple() && stack_.back().toTupleRef().elements().empty(), "unsupported OrderedDict constructor");\n      stack_.back() = c10::impl::GenericDict(c10::AnyType::get(), c10::AnyType::get());')+s[end:]
          # Python state_dict may also include _metadata as object state.
          old='    case PickleOpCode::BUILD:\n    case PickleOpCode::REDUCE: {'
          assert old in s
          s=s.replace(old,'''    case PickleOpCode::BUILD:
                if (stack_.size() >= 2 && stack_[stack_.size()-2].isGenericDict() && stack_.back().isGenericDict()) {
                  auto state = stack_.back().toGenericDict();
                  TORCH_CHECK(state.size() == 1 && state.contains(IValue("_metadata")), "unsupported dictionary BUILD state");
                  stack_.pop_back();
                  break;
                }
                [[fallthrough]];
              case PickleOpCode::REDUCE: {''')
          p.write_text(s)
          PATCH
          git clone --depth 1 --branch v1.10.0 https://github.com/facebookresearch/faiss.git faiss-src
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'huggingface_hub>=0.26,<1' 'numpy==1.26.4'
          python -c 'import torch,numpy; assert torch.ones(1).numpy().dtype == numpy.float32'
          mkdir -p stage04-native
          python - <<'PY'
          import hashlib, zipfile, pathlib, shutil, json
          from huggingface_hub import hf_hub_download
          frozen=pathlib.Path("frozen/VoiceBank_03_Presets.json")
          config=json.loads(frozen.read_text())
          cases=[
              ("F8","Rokkonrol/RVC_models","dataset","c4bdb3bb7aef5f7d213f79f57decea9e644fd4d5","Russell Archey [Explore With Us (EWU)].zip","88ba827fe6023d102d6d84a7bc26e1e181b40bb47977ccae1c378b320b3c1582","df8f49d094e57b0abe726d8650de5d865546bce4d893ec59841c51ee0777a08b"),
              ("F9","rayzox57/Joyca_High_RVC","model","035dff8fce32b4efda3e9c25e045e73ac5819812","Joyca_High_Voice_v2_600e.zip","4924376afcc16f3a8c109822239fdc5ce73c0e2459bb9fc71e55564aae0e0c99","d0ea3825eeebaef3531a8eb928ab001908ab7147499f818cfac820bd35074d86")
          ]
          for name,repo,kind,rev,filename,archive_hash,pth_hash in cases:
              p=next(x for x in config["presets"].values() if x["shortcut"]==name)
              fingerprint=p["rvc"]["stage02_model_fingerprint"]
              assert p["rvc"]["parameters"]["index_rate"]==0
              path=hf_hub_download(repo,filename,repo_type=kind,revision=rev)
              with open(path,"rb") as f: assert hashlib.file_digest(f,"sha256").hexdigest()==archive_hash
              with zipfile.ZipFile(path) as z:
                  for ext in (".pth",".index"):
                      members=[n for n in z.namelist() if n.endswith(ext) and (ext==".pth" or pathlib.PurePosixPath(n).name.startswith("added_"))]
                      assert len(members)==1
                      target=pathlib.Path(name+ext)
                      with z.open(members[0]) as src,target.open("wb") as dst: shutil.copyfileobj(src,dst)
                      with target.open("rb") as f: assert hashlib.file_digest(f,"sha256").hexdigest()==fingerprint[ext[1:]+"_sha256"]
                      print("ORIGINAL_HASH_PASS",name,ext,flush=True)
              import torch
              ckpt=torch.load(name+'.pth',map_location='cpu',weights_only=True)
              with open(name+'.golden.tsv','w') as manifest:
                  for key,t in ckpt['weight'].items():
                      raw=t.detach().contiguous().reshape(-1).view(torch.uint8).numpy().tobytes()
                      print(key,t.numel(),t.element_size(),str(t.dtype).split('.')[-1],','.join(map(str,t.shape)) or '-',hashlib.sha256(raw).hexdigest(),sep='\t',file=manifest)
          shutil.copyfile(frozen,"stage04-native/VoiceBank_03_Presets.json")
          rows=[]
          for p in sorted(config["presets"].values(),key=lambda p:p["shortcut"]):
              a=p["rvc"]["parameters"]
              env=a["rms_mix_rate"] if "rms_mix_rate" in a else a["volume_envelope"]
              rows.append(' {"%s",%d,%.2ff,%.2ff,%.2ff},' % (p["shortcut"],a["pitch_shift_semitones"],a["index_rate"],a["protect"],env))
          pathlib.Path("presets.inc").write_text("\n".join(rows)+"\n")
          PY
      - name: Generate official TextEncoder reference
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI.git upstream
          git -C upstream checkout 81eed5e8f68b6bed1789f682fe78cdd324495afc
          python -m pip install scipy==1.14.1 librosa==0.10.2.post1 transformers==4.49.0
          PYTHONPATH="$PWD/upstream" python - <<'PY'
          import torch
          from infer.module.models import TextEncoder, ResidualCouplingBlock, GeneratorNSF
          from unittest.mock import patch
          import math
          torch.set_num_threads(2)
          with torch.inference_mode():
              for name in ("F8","F9"):
                  ck=torch.load(name+".pth",map_location="cpu",weights_only=True)
                  cfg=ck["config"]
                  enc=TextEncoder(768,*cfg[2:8],float(cfg[8]),True).eval()
                  enc.load_state_dict({k[6:]:v for k,v in ck["weight"].items() if k.startswith("enc_p.")},strict=True)
                  flow=ResidualCouplingBlock(cfg[2],cfg[3],5,1,3,gin_channels=cfg[16]).eval()
                  flow.load_state_dict({k[5:]:v for k,v in ck["weight"].items() if k.startswith("flow.")},strict=True)
                  flow.remove_weight_norm()
                  sr=cfg[-1] if isinstance(cfg[-1],int) else int(cfg[-1].rstrip("k"))*1000
                  gen=GeneratorNSF(cfg[2],*cfg[9:15],gin_channels=cfg[16],sr=sr,is_half=False).eval()
                  gen.load_state_dict({k[4:]:v for k,v in ck["weight"].items() if k.startswith("dec.")},strict=True)
                  gen.remove_weight_norm()
                  upp=math.prod(cfg[12])
                  for t in (8,33):
                      phone=(torch.arange(t*768,dtype=torch.float32).remainder(97)-48).reshape(1,t,768)/97
                      pitch=torch.arange(t,dtype=torch.long).remainder(254).reshape(1,t)+1
                      m,logs,mask=enc(phone,pitch,torch.tensor([t-2]))
                      torch.cat((m,logs,mask),dim=1).contiguous().numpy().tofile(f"{name}.enc{t}.f32")
                      print("REFERENCE_ENCODER",name,t,m.shape,flush=True)
                      z=(torch.arange(t*cfg[2],dtype=torch.float32).remainder(67)-33).reshape(1,cfg[2],t)/67
                      g=ck["weight"]["emb_g.weight"][0].float().reshape(1,-1,1)
                      flow(z,mask,g=g,reverse=True).contiguous().numpy().tofile(f"{name}.flow{t}.f32")
                      print("REFERENCE_FLOW",name,t,flush=True)
                      z2=flow(z,mask,g=g,reverse=True)*mask
                      f0=torch.where(torch.arange(t)%4==0,0.,110.+torch.arange(t)*3).reshape(1,t)
                      noise=(torch.arange(t*upp,dtype=torch.float32).remainder(31)-15).reshape(1,t*upp,1)/15
                      with patch("torch.randn_like",return_value=noise):
                          audio=gen(z2,f0,g=g)
                      audio.contiguous().numpy().tofile(f"{name}.gen{t}.f32")
                      print("REFERENCE_GENERATOR",name,t,audio.shape,flush=True)
          PY
      - name: Generate official RMVPE reference from original checkpoint
        run: |
          PYTHONPATH="$PWD/upstream" python - <<'PY'
          import torch, hashlib, shutil, pathlib
          from huggingface_hub import hf_hub_download
          from infer.rmvpe import RMVPE
          src=hf_hub_download("lj1995/VoiceConversionWebUI","rmvpe.pt")
          shutil.copyfile(src,"rmvpe.pt")
          with open("rmvpe.pt","rb") as f:
              print("RMVPE_ORIGINAL_SHA256",hashlib.file_digest(f,"sha256").hexdigest(),flush=True)
          torch.set_num_threads(2)
          model=RMVPE("rmvpe.pt",False,"cpu")
          with torch.inference_mode():
              a=torch.arange(5120,dtype=torch.float32)/16000
              x=(torch.sin(a*2*3.141592653589793*123)*0.2+torch.sin(a*2*3.141592653589793*246)*0.06).reshape(1,-1)
              x[:,0:800]=0
              mel=model.extract_mel(x)
              hidden=model.mel2hidden(mel)
              f0=model.decode(hidden.squeeze(0).numpy(),thred=0.03)
              for key,val in (("input",x),("mel",mel),("hidden",hidden),("f0",torch.from_numpy(f0))):
                  val.float().contiguous().numpy().tofile("rmvpe."+key+".f32")
              print("RMVPE_REFERENCE",list(mel.shape),list(hidden.shape),flush=True)
          PY
      - name: Generate official HuBERT reference from unchanged distributed checkpoint
        run: |
          PYTHONPATH="$PWD/upstream" python - <<'PY'
          import hashlib, pathlib, torch, shutil
          from huggingface_hub import snapshot_download
          from infer.hubert import load_hubert_model,extract_hubert_features
          dest=pathlib.Path("upstream/assets")
          snapshot_download("lj1995/VoiceConversionWebUI",revision="1be9d36",allow_patterns=["hubert_base/*"],local_dir=dest)
          src=dest/"hubert_base/pytorch_model.bin"
          with src.open("rb") as f:
              assert hashlib.file_digest(f,"sha256").hexdigest()=="cc8c20f4b90a520757260197a3ff2505705a7adbd20ad9eeaa4e1a9b38442ef5"
          shutil.copyfile(src,"hubert.bin")
          torch.set_num_threads(2)
          model=load_hubert_model("cpu",False)
          import numpy as np
          x=torch.from_numpy(np.fromfile("rmvpe.input.f32",dtype=np.float32)).reshape(1,-1)
          with torch.inference_mode():
              for v in ("v1","v2"):
                  y=extract_hubert_features(model,x,v)
                  y.float().contiguous().numpy().tofile("hubert."+v+".f32")
                  print("HUBERT_REFERENCE",v,list(y.shape),flush=True)
          PY
      - name: Build native model bank and index path
        run: |
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.18)
          project(voicebank_native LANGUAGES CXX)
          find_package(Torch REQUIRED)
          find_package(OpenSSL REQUIRED)
          find_package(OpenMP REQUIRED)
          find_package(BLAS REQUIRED)
          find_package(LAPACK REQUIRED)
          set(FAISS_ENABLE_GPU OFF CACHE BOOL "" FORCE)
          set(FAISS_ENABLE_PYTHON OFF CACHE BOOL "" FORCE)
          set(FAISS_ENABLE_C_API OFF CACHE BOOL "" FORCE)
          set(BUILD_TESTING OFF CACHE BOOL "" FORCE)
          add_subdirectory(faiss-src faiss-build EXCLUDE_FROM_ALL)
          add_executable(voicebank_native core.cpp unpickler.cpp)
          target_link_libraries(voicebank_native PRIVATE OpenSSL::Crypto)
          target_link_libraries(voicebank_native PRIVATE "${TORCH_LIBRARIES}" faiss LAPACK::LAPACK BLAS::BLAS OpenMP::OpenMP_CXX)
          set_property(TARGET voicebank_native PROPERTY CXX_STANDARD 17)
          EOF
          cat > core.cpp <<'EOF'
          #include <torch/csrc/jit/serialization/import_read.h>
          #include <caffe2/serialize/inline_container.h>
          #include <ATen/ATen.h>
          #include <ATen/core/grad_mode.h>
          #include <algorithm>
          #include <torch/csrc/jit/serialization/unpickler.h>
          #include <openssl/sha.h>
          #include <fstream>
          #include <iomanip>
          #include <sstream>
          #include <unordered_map>
          #include <cstring>
          #include <faiss/Index.h>
          #include <faiss/index_io.h>
          #include <array>
          #include <atomic>
          #include <chrono>
          #include <cmath>
          #include <iostream>
          #include <memory>
          #include <stdexcept>
          #include <vector>
          using Clock=std::chrono::steady_clock;
          double ms(Clock::time_point t){return std::chrono::duration<double,std::milli>(Clock::now()-t).count();}
          void require(bool v,const char* msg){if(!v) throw std::runtime_error(msg);}
          struct Preset{const char* name;int pitch;float index,protect,rms;};
          constexpr std::array<Preset,4> presets{{
          #include "presets.inc"
          }};
          constexpr int sample_rate=48000;
          constexpr int target_samples=960;
          static_assert(target_samples*1000/sample_rate==20);
          c10::IValue load_original(caffe2::serialize::PyTorchStreamReader& archive){
           auto record=archive.getRecord("data.pkl");
           auto& ptr=std::get<0>(record);
           auto size=std::get<1>(record);
           size_t pos=0;
           auto input=[&](char* dst,size_t n){n=std::min(n,size-pos);std::memcpy(dst,static_cast<const char*>(ptr.get())+pos,n);pos+=n;return n;};
           auto storage=[&](const std::string& key){return std::get<0>(archive.getRecord("data/"+key));};
           torch::jit::Unpickler u(input,nullptr,nullptr,storage,at::Device(at::kCPU),false,torch::jit::Unpickler::defaultTypeParser,nullptr);
           u.set_version(archive.version());
           return u.parse_ivalue();
          }
          std::string digest_tensor(const at::Tensor& t){
           auto b=t.contiguous();
           unsigned char digest[SHA256_DIGEST_LENGTH];
           SHA256(static_cast<const unsigned char*>(b.data_ptr()),b.nbytes(),digest);
           std::ostringstream out;
           for(auto x:digest)out<<std::hex<<std::setw(2)<<std::setfill('0')<<int(x);
           return out.str();
          }
          struct TextEncoder {
           std::unordered_map<std::string,at::Tensor> w;
           int64_t hidden,heads,layers,inter;
           explicit TextEncoder(const c10::impl::GenericDict& root){
            auto config=root.at(c10::IValue("config"));auto cfg=config.toListRef();
            inter=cfg[2].toInt();hidden=cfg[3].toInt();heads=cfg[5].toInt();layers=cfg[6].toInt();
            auto weights=root.at(c10::IValue("weight")).toGenericDict();
            for(auto& kv:weights){auto key=kv.key().toStringRef();if(key.rfind("enc_p.",0)==0)w.emplace(key.substr(6),kv.value().toTensor().to(at::kFloat));}
            require(hidden%heads==0,"encoder head geometry");
           }
           const at::Tensor& W(const std::string& k)const{return w.at(k);}
           at::Tensor conv(const at::Tensor& x,const std::string& k,bool pad=false)const{
            auto a=W(k+".weight");auto n=a.size(2);
            return at::conv1d(pad?at::constant_pad_nd(x,{(n-1)/2,n/2},0):x,a,W(k+".bias"),at::IntArrayRef{1},at::IntArrayRef{0},at::IntArrayRef{1},1);
           }
           at::Tensor norm(const at::Tensor& x,const std::string& k)const{
            return at::layer_norm(x.transpose(1,2),{hidden},W(k+".gamma"),W(k+".beta"),1e-5,true).transpose(1,2);
           }
           at::Tensor relative(const at::Tensor& x,int64_t t)const{
            auto win=(x.size(1)-1)/2;auto pad=std::max<int64_t>(t-win-1,0);auto start=std::max<int64_t>(win+1-t,0);
            return at::constant_pad_nd(x,{0,0,pad,pad},0).slice(1,start,start+2*t-1);
           }
           at::Tensor attention(const at::Tensor& x,const at::Tensor& mask,const std::string& k)const{
            auto b=x.size(0),t=x.size(2),d=hidden/heads;
            auto q=conv(x,k+".conv_q").reshape({b,heads,d,t}).transpose(2,3)/std::sqrt(double(d));
            auto key=conv(x,k+".conv_k").reshape({b,heads,d,t}).transpose(2,3);
            auto v=conv(x,k+".conv_v").reshape({b,heads,d,t}).transpose(2,3);
            auto score=at::matmul(q,key.transpose(-2,-1));
            auto r=at::matmul(q,relative(W(k+".emb_rel_k"),t).unsqueeze(0).transpose(-2,-1));
            r=at::constant_pad_nd(r,{0,1},0).reshape({b,heads,2*t*t});
            r=at::constant_pad_nd(r,{0,t-1},0).reshape({b,heads,t+1,2*t-1}).slice(2,0,t).slice(3,t-1,2*t-1);
            auto p=at::softmax((score+r).masked_fill((mask.unsqueeze(2)*mask.unsqueeze(-1)).eq(0),-1e4),-1);
            auto out=at::matmul(p,v);
            r=at::constant_pad_nd(p,{0,t-1},0).reshape({b,heads,2*t*t-t});
            r=at::constant_pad_nd(r,{t,0},0).reshape({b,heads,t,2*t}).slice(3,1,2*t);
            out=out+at::matmul(r,relative(W(k+".emb_rel_v"),t).unsqueeze(0));
            return conv(out.transpose(2,3).contiguous().reshape({b,hidden,t}),k+".conv_o");
           }
           at::Tensor forward(const at::Tensor& phone,const at::Tensor& pitch,const at::Tensor& lengths)const{
            auto t=phone.size(1);
            auto x=at::linear(phone,W("emb_phone.weight"),W("emb_phone.bias"))+at::embedding(W("emb_pitch.weight"),pitch,-1,false,false);
            x=at::leaky_relu(x*std::sqrt(double(hidden)),0.1).transpose(1,2);
            auto mask=at::arange(t,lengths.options()).unsqueeze(0).lt(lengths.unsqueeze(1)).unsqueeze(1).to(x.scalar_type());
            x=x*mask;
            for(int i=0;i<layers;++i){
             auto n=std::to_string(i);
             x=norm(x+attention(x,mask,"encoder.attn_layers."+n),"encoder.norm_layers_1."+n);
             auto y=at::relu(conv(x*mask,"encoder.ffn_layers."+n+".conv_1",true));
             y=conv(y*mask,"encoder.ffn_layers."+n+".conv_2",true)*mask;
             x=norm(x+y,"encoder.norm_layers_2."+n);
            }
            auto stats=conv(x*mask,"proj")*mask;require(stats.size(1)==2*inter,"encoder projection");
            return at::cat({stats,mask},1).contiguous();
           }
          };
          void verify_encoder(const c10::impl::GenericDict& root,const std::string& name){
           at::NoGradGuard guard;
           TextEncoder enc(root);
           for(int64_t t:{8,33}){
            auto phone=(at::arange(t*768,at::TensorOptions().dtype(at::kFloat)).remainder(97)-48).reshape({1,t,768})/97;
            auto pitch=at::arange(t,at::TensorOptions().dtype(at::kLong)).remainder(254).reshape({1,t})+1;
            auto lengths=at::full({1},t-2,at::TensorOptions().dtype(at::kLong));
            auto start=Clock::now();auto out=enc.forward(phone,pitch,lengths);auto elapsed=ms(start);
            auto ref=at::empty_like(out);std::ifstream in(name+".enc"+std::to_string(t)+".f32",std::ios::binary);
            in.read(static_cast<char*>(ref.data_ptr()),ref.nbytes());
            require(in.gcount()==static_cast<std::streamsize>(ref.nbytes()),"missing encoder reference");
            std::cout<<"TEXT_ENCODER "<<name<<" frames="<<t<<" max_abs_error="<<(out-ref).abs().max().item<float>()<<" cpu_ms="<<elapsed<<std::endl;
            require(at::allclose(out,ref,1e-4,1e-4),"official TextEncoder mismatch");
           }
          }
          // RVC reverse residual coupling: weight-normalized WN, flip, mean-only coupling.
          struct ReverseFlow {
           std::unordered_map<std::string,at::Tensor> w;
           int64_t hidden,inter;
           explicit ReverseFlow(const c10::impl::GenericDict& root){
            auto config=root.at(c10::IValue("config"));auto cfg=config.toListRef();
            inter=cfg[2].toInt();hidden=cfg[3].toInt();
            auto weights=root.at(c10::IValue("weight")).toGenericDict();
            for(auto& kv:weights){
             auto k=kv.key().toStringRef();
             if(k.rfind("flow.",0)==0||k=="emb_g.weight")w.emplace(k,kv.value().toTensor().to(at::kFloat));
            }
            std::vector<std::string> keys;
            for(auto& kv:w)if(kv.first.size()>9&&kv.first.substr(kv.first.size()-9)==".weight_v")keys.push_back(kv.first);
            for(auto& k:keys){
             auto base=k.substr(0,k.size()-9);
             auto v=w.at(k);
             w.emplace(base+".weight",at::_weight_norm(v,w.at(base+".weight_g"),0));
            }
           }
           at::Tensor conv(const at::Tensor& x,const std::string& k)const{
            auto a=w.at(k+".weight");int64_t padding=(a.size(2)-1)/2;
            return at::conv1d(x,a,w.at(k+".bias"),at::IntArrayRef{1},at::IntArrayRef{padding},at::IntArrayRef{1},1);
           }
           at::Tensor forward(at::Tensor x,const at::Tensor& mask,int64_t sid)const{
            auto g=w.at("emb_g.weight").select(0,sid).reshape({1,-1,1});
            for(int f=6;f>=0;f-=2){
             x=at::flip(x,{1});
             auto k="flow.flows."+std::to_string(f);
             auto x0=x.slice(1,0,inter/2),x1=x.slice(1,inter/2,inter);
             auto h=conv(x0,k+".pre")*mask;
             auto cond=conv(g,k+".enc.cond_layer"),out=at::zeros_like(h);
             for(int i=0;i<3;++i){
              auto s=std::to_string(i);
              auto a=conv(h,k+".enc.in_layers."+s)+cond.slice(1,i*2*hidden,(i+1)*2*hidden);
              auto acts=at::tanh(a.slice(1,0,hidden))*at::sigmoid(a.slice(1,hidden,2*hidden));
              auto res=conv(acts,k+".enc.res_skip_layers."+s);
              if(i<2){h=(h+res.slice(1,0,hidden))*mask;out=out+res.slice(1,hidden,2*hidden);}
              else out=out+res;
             }
             auto m=conv(out*mask,k+".post")*mask;
             x=at::cat({x0,(x1-m)*mask},1);
            }
            return x.contiguous();
           }
          };
          void verify_flow(const c10::impl::GenericDict& root,const std::string& name){
           at::NoGradGuard guard;ReverseFlow flow(root);
           for(int64_t t:{8,33}){
            auto z=(at::arange(t*flow.inter,at::TensorOptions().dtype(at::kFloat)).remainder(67)-33).reshape({1,flow.inter,t})/67;
            auto mask=at::arange(t,at::TensorOptions().dtype(at::kLong)).lt(t-2).reshape({1,1,t}).to(at::kFloat);
            auto start=Clock::now();auto out=flow.forward(z,mask,0);auto elapsed=ms(start);
            auto ref=at::empty_like(out);std::ifstream in(name+".flow"+std::to_string(t)+".f32",std::ios::binary);
            in.read(static_cast<char*>(ref.data_ptr()),ref.nbytes());require(in.gcount()==static_cast<std::streamsize>(ref.nbytes()),"missing flow reference");
            std::cout<<"REVERSE_FLOW "<<name<<" frames="<<t<<" max_abs_error="<<(out-ref).abs().max().item<float>()<<" cpu_ms="<<elapsed<<std::endl;
            require(at::allclose(out,ref,1e-4,1e-4),"official reverse flow mismatch");
           }
          }
          // RVC neural source-filter decoder; deterministic injected excitation noise for parity tests.
          struct Generator {
           std::unordered_map<std::string,at::Tensor> w;
           std::vector<int64_t> rates,kernels;
           std::vector<std::vector<int64_t>> dilations;
           int64_t sr,upp=1;bool block1;
           explicit Generator(const c10::impl::GenericDict& root){
            auto config=root.at(c10::IValue("config"));auto cfg=config.toListRef();
            block1=cfg[9].toStringRef()=="1";
            auto ds=cfg[11].toListRef();
            for(auto& d:ds){std::vector<int64_t> a;for(auto& v:d.toListRef())a.push_back(v.toInt());dilations.push_back(a);}
            for(auto& v:cfg[12].toListRef()){rates.push_back(v.toInt());upp*=v.toInt();}
            for(auto& v:cfg[14].toListRef())kernels.push_back(v.toInt());
            sr=cfg[17].isInt()?cfg[17].toInt():std::stoll(cfg[17].toStringRef())*1000;
            auto weights=root.at(c10::IValue("weight")).toGenericDict();
            for(auto& kv:weights){auto k=kv.key().toStringRef();if(k.rfind("dec.",0)==0||k=="emb_g.weight")w.emplace(k,kv.value().toTensor().to(at::kFloat));}
            std::vector<std::string> keys;
            for(auto& kv:w)if(kv.first.size()>9&&kv.first.substr(kv.first.size()-9)==".weight_v")keys.push_back(kv.first);
            for(auto& k:keys){auto base=k.substr(0,k.size()-9);w.emplace(base+".weight",at::_weight_norm(w.at(k),w.at(base+".weight_g"),0));}
           }
           at::Tensor conv(const at::Tensor& x,const std::string& k,int64_t stride=1,int64_t pad=-1,int64_t dil=1)const{
            auto a=w.at(k+".weight");if(pad<0)pad=(a.size(2)-1)*dil/2;
            std::optional<at::Tensor> bias;if(w.count(k+".bias"))bias=w.at(k+".bias");
            return at::conv1d(x,a,bias,at::IntArrayRef{stride},at::IntArrayRef{pad},at::IntArrayRef{dil},1);
           }
           at::Tensor source(const at::Tensor& f0,const at::Tensor& noise)const{
            auto f=f0.unsqueeze(-1);
            auto rad=f/double(sr)*at::arange(1,upp+1,f.options());
            auto last=at::fmod(rad.slice(-1,upp-1,upp).to(at::kFloat)+0.5,1.0)-0.5;
            auto acc=at::fmod(last.cumsum(1),1.0).to(f.scalar_type());
            rad=rad+at::constant_pad_nd(acc,{0,0,1,-1},0);
            auto sine=at::sin(rad.reshape({f.size(0),-1,1})*(2.0*3.14159265358979323846))*0.1;
            auto uv=f.gt(0).to(f.scalar_type()).repeat_interleave(upp,1);
            auto waves=sine*uv+(uv*0.003+(1-uv)*0.1/3.0)*noise;
            return at::tanh(at::linear(waves,w.at("dec.m_source.l_linear.weight"),w.at("dec.m_source.l_linear.bias"))).transpose(1,2);
           }
           at::Tensor residual(at::Tensor x,const std::string& k,const std::vector<int64_t>& ds)const{
            for(size_t i=0;i<ds.size();++i){auto n=std::to_string(i);
             auto y=conv(at::leaky_relu(x,0.1),k+(block1?".convs1.":".convs.")+n,1,-1,ds[i]);
             if(block1)y=conv(at::leaky_relu(y,0.1),k+".convs2."+n);
             x=x+y;
            }return x;
           }
           at::Tensor forward(at::Tensor x,const at::Tensor& f0,const at::Tensor& noise,int64_t sid)const{
            auto har=source(f0,noise);auto g=w.at("emb_g.weight").select(0,sid).reshape({1,-1,1});
            x=conv(x,"dec.conv_pre");if(w.count("dec.cond.weight"))x=x+conv(g,"dec.cond");
            int64_t rest=upp;
            for(size_t i=0;i<rates.size();++i){auto k="dec.ups."+std::to_string(i);auto u=rates[i];rest/=u;
             x=at::conv_transpose1d(at::leaky_relu(x,0.1),w.at(k+".weight"),w.at(k+".bias"),{u},{(kernels[i]-u)/2},{0},1,{1});
             x=x+conv(har,"dec.noise_convs."+std::to_string(i),rest,rest==1?0:rest/2);
             at::Tensor sum;
             for(size_t j=0;j<dilations.size();++j){auto y=residual(x,"dec.resblocks."+std::to_string(i*dilations.size()+j),dilations[j]);sum=sum.defined()?sum+y:y;}
             x=sum/double(dilations.size());
            }
            return at::tanh(conv(at::leaky_relu(x,0.01),"dec.conv_post")).contiguous();
           }
          };
          void verify_generator(const c10::impl::GenericDict& root,const std::string& name){
           at::NoGradGuard guard;Generator gen(root);ReverseFlow flow(root);
           for(int64_t t:{8,33}){
            auto opts=at::TensorOptions().dtype(at::kFloat);
            auto z=(at::arange(t*flow.inter,opts).remainder(67)-33).reshape({1,flow.inter,t})/67;
            auto mask=at::arange(t,at::TensorOptions().dtype(at::kLong)).lt(t-2).reshape({1,1,t}).to(at::kFloat);
            z=flow.forward(z,mask,0)*mask;
            auto a=at::arange(t,opts);auto f0=at::where(a.remainder(4).eq(0),at::zeros_like(a),110+a*3).reshape({1,t});
            auto noise=(at::arange(t*gen.upp,opts).remainder(31)-15).reshape({1,t*gen.upp,1})/15;
            auto start=Clock::now();auto out=gen.forward(z,f0,noise,0);auto elapsed=ms(start);
            auto ref=at::empty_like(out);std::ifstream in(name+".gen"+std::to_string(t)+".f32",std::ios::binary);
            in.read(static_cast<char*>(ref.data_ptr()),ref.nbytes());require(in.gcount()==static_cast<std::streamsize>(ref.nbytes()),"missing generator reference");
            std::cout<<"GENERATOR "<<name<<" frames="<<t<<" max_abs_error="<<(out-ref).abs().max().item<float>()<<" cpu_ms="<<elapsed<<std::endl;
            require(at::allclose(out,ref,1e-3,1e-3),"official GeneratorNSF mismatch");
           }
          }
          // Native RMVPE: original E2E state_dict, Slaney-normalized HTK mel, U-Net, bidirectional GRU.
          struct NativeRMVPE {
           std::unordered_map<std::string,at::Tensor> w;
           at::Tensor basis,window;
           explicit NativeRMVPE(const std::string& path){
            caffe2::serialize::PyTorchStreamReader reader(path);
            auto root=load_original(reader).toGenericDict();
            for(auto& kv:root)if(kv.value().isTensor())w.emplace(kv.key().toStringRef(),kv.value().toTensor().to(at::kFloat));
            require(w.count("fc.0.gru.weight_ih_l0")&&w.count("unet.encoder.bn.weight"),"RMVPE state dictionary");
            auto opts=at::TensorOptions().dtype(at::kFloat);
            basis=at::empty({128,513},opts);auto ptr=basis.data_ptr<float>();
            std::array<double,130> hz{};
            const double m0=2595*std::log10(1+30.0/700),m1=2595*std::log10(1+8000.0/700);
            for(int i=0;i<130;++i)hz[i]=700*(std::pow(10,(m0+(m1-m0)*i/129)/2595)-1);
            for(int i=0;i<128;++i)for(int j=0;j<513;++j){
             double f=j*16000.0/1024;
             double lo=(f-hz[i])/(hz[i+1]-hz[i]),hi=(hz[i+2]-f)/(hz[i+2]-hz[i+1]);
             ptr[i*513+j]=float(std::max(0.0,std::min(lo,hi))*2/(hz[i+2]-hz[i]));
            }
            window=at::hann_window(1024,true,opts);
           }
           const at::Tensor& W(const std::string& k)const{return w.at(k);}
           at::Tensor conv(const at::Tensor& x,const std::string& k,int64_t pad=1)const{
            std::optional<at::Tensor> b;if(w.count(k+".bias"))b=W(k+".bias");
            return at::conv2d(x,W(k+".weight"),b,at::IntArrayRef{1,1},at::IntArrayRef{pad,pad},at::IntArrayRef{1,1},1);
           }
           at::Tensor bn(const at::Tensor& x,const std::string& k)const{
            return at::batch_norm(x,W(k+".weight"),W(k+".bias"),W(k+".running_mean"),W(k+".running_var"),false,0.01,1e-5,true);
           }
           at::Tensor block(const at::Tensor& x,const std::string& k)const{
            auto h=at::relu(bn(conv(x,k+".conv.0"),k+".conv.1"));
            h=at::relu(bn(conv(h,k+".conv.3"),k+".conv.4"));
            return h+(w.count(k+".shortcut.weight")?conv(x,k+".shortcut",0):x);
           }
           at::Tensor blocks(at::Tensor x,const std::string& k)const{
            for(int i=0;i<4;++i)x=block(x,k+"."+std::to_string(i));return x;
           }
           at::Tensor mel(const at::Tensor& input)const{
            auto framed=at::reflection_pad1d(input.unsqueeze(1),{512,512}).squeeze(1).unfold(-1,1024,160)*window;
            auto fft=at::fft_rfft(framed,1024,-1,std::nullopt);
            auto mag=at::abs(fft).transpose(1,2);
            return at::log(at::matmul(basis,mag).clamp_min(1e-5));
           }
           at::Tensor hidden(const at::Tensor& m)const{
            auto t=m.size(2);auto n=(32-t%32)%32;
            auto x=at::constant_pad_nd(m,{0,n},0).transpose(1,2).unsqueeze(1);
            x=bn(x,"unet.encoder.bn");std::vector<at::Tensor> skip;
            for(int i=0;i<5;++i){x=blocks(x,"unet.encoder.layers."+std::to_string(i)+".conv");skip.push_back(x);x=at::avg_pool2d(x,{2,2},{2,2},{0,0},false,true,std::nullopt);}
            for(int i=0;i<4;++i)x=blocks(x,"unet.intermediate.layers."+std::to_string(i)+".conv");
            for(int i=0;i<5;++i){
             auto k="unet.decoder.layers."+std::to_string(i);
             x=at::conv_transpose2d(x,W(k+".conv1.0.weight"),std::nullopt,{2,2},{1,1},{1,1},1,{1,1});
             x=at::relu(bn(x,k+".conv1.1"));
             x=blocks(at::cat({x,skip[4-i]},1),k+".conv2");
            }
            x=conv(x,"cnn").transpose(1,2).flatten(2);
            std::vector<at::Tensor> p;
            for(auto suffix:{"","_reverse"})for(auto key:{"weight_ih_l0","weight_hh_l0","bias_ih_l0","bias_hh_l0"})p.push_back(W(std::string("fc.0.gru.")+key+suffix));
            auto hx=at::zeros({2,x.size(0),256},x.options());
            x=std::get<0>(at::gru(x,hx,p,true,1,0.0,false,true,true));
            return at::sigmoid(at::linear(x,W("fc.1.weight"),W("fc.1.bias"))).slice(1,0,t).contiguous();
           }
           at::Tensor decode(const at::Tensor& h)const{
            auto sal=h.squeeze(0);auto centers=sal.argmax(1,true);
            auto offsets=at::arange(9,centers.options()).reshape({1,9});
            auto ids=centers+offsets;
            auto probs=at::constant_pad_nd(sal,{4,4},0).gather(1,ids);
            auto cents=at::constant_pad_nd(at::arange(360,sal.options().dtype(at::kDouble))*20+1997.3794084376191,{4,4},0);
            auto values=cents.index_select(0,ids.reshape({-1})).reshape(ids.sizes());
            auto avg=(probs.to(at::kDouble)*values).sum(1)/probs.sum(1).to(at::kDouble);
            auto f=10*at::pow(2,avg/1200);
            return at::where(std::get<0>(sal.max(1)).le(0.03),at::zeros_like(f),f).to(at::kFloat);
           }
          };
          at::Tensor fixture(const std::string& path,at::IntArrayRef sizes){
           auto x=at::empty(sizes,at::TensorOptions().dtype(at::kFloat));
           std::ifstream in(path,std::ios::binary);in.read(static_cast<char*>(x.data_ptr()),x.nbytes());
           require(in.gcount()==static_cast<std::streamsize>(x.nbytes()),"missing RMVPE fixture");
           return x;
          }
          void verify_rmvpe(){
