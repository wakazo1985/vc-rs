name: Stage 04 native core 20ms gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/stage04-native-core-20ms.yml'
  push:
    branches: [stage01-python-verification]
    paths:
      - '.github/workflows/stage04-native-core-20ms.yml'
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: VoiceBank-Stage03-Frozen
          path: frozen
          github-token: ${{ github.token }}
          run-id: '46134456010'
      - name: Acquire exact original checkpoints and indices
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libopenblas-dev libssl-dev
          curl --fail --location --retry 3 https://raw.githubusercontent.com/pytorch/pytorch/v2.7.1/torch/csrc/jit/serialization/unpickler.cpp -o unpickler.cpp
          python - <<'PATCH'
          from pathlib import Path
          p=Path('unpickler.cpp')
          s=p.read_text()
          marker='} else if (module_name == "collections" && class_name == "OrderedDict") {'
          start=s.index(marker)
          end=s.index('} else if (module_name == "torch" && class_name == "device") {',start)
          old=s[start:end]
          assert 'stack_.back() = IValue();' in old
          # Preserve actual OrderedDict keys and insertion order in the native dict.
          s=s[:start]+old.replace('stack_.back() = IValue();','TORCH_CHECK(stack_.back().isTuple() && stack_.back().toTupleRef().elements().empty(), "unsupported OrderedDict constructor");\n      stack_.back() = c10::impl::GenericDict(c10::AnyType::get(), c10::AnyType::get());')+s[end:]
          # Python state_dict may also include _metadata as object state.
          old='    case PickleOpCode::BUILD:\n    case PickleOpCode::REDUCE: {'
          assert old in s
          s=s.replace(old,'''    case PickleOpCode::BUILD:
                if (stack_.size() >= 2 && stack_[stack_.size()-2].isGenericDict() && stack_.back().isGenericDict()) {
                  auto state = stack_.back().toGenericDict();
                  TORCH_CHECK(state.size() == 1 && state.contains(IValue("_metadata")), "unsupported dictionary BUILD state");
                  stack_.pop_back();
                  break;
                }
                [[fallthrough]];
              case PickleOpCode::REDUCE: {''')
          p.write_text(s)
          PATCH
          git clone --depth 1 --branch v1.10.0 https://github.com/facebookresearch/faiss.git faiss-src
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'huggingface_hub>=0.26,<1' 'numpy==1.26.4'
          python -c 'import torch,numpy; assert torch.ones(1).numpy().dtype == numpy.float32'
          mkdir -p stage04-native
          python - <<'PY'
          import hashlib, zipfile, pathlib, shutil, json
          from huggingface_hub import hf_hub_download
          frozen=pathlib.Path("frozen/VoiceBank_03_Presets.json")
          config=json.loads(frozen.read_text())
          cases=[
              ("F6","VofVoices/maxwell-young-fantastic-max-RVC-v2","model","main","maxwellyoung(FantasticMax).zip","01805b226446741e8b077d102255bd55c7b85caa976f1fc7030033880649708d","be2f20b934aa3609938342cc594580789353cf5e481b5a4c3f3a153087b7189c"),
              ("F8","Rokkonrol/RVC_models","dataset","c4bdb3bb7aef5f7d213f79f57decea9e644fd4d5","Russell Archey [Explore With Us (EWU)].zip","88ba827fe6023d102d6d84a7bc26e1e181b40bb47977ccae1c378b320b3c1582","df8f49d094e57b0abe726d8650de5d865546bce4d893ec59841c51ee0777a08b"),
              ("F9","rayzox57/Joyca_High_RVC","model","035dff8fce32b4efda3e9c25e045e73ac5819812","Joyca_High_Voice_v2_600e.zip","4924376afcc16f3a8c109822239fdc5ce73c0e2459bb9fc71e55564aae0e0c99","d0ea3825eeebaef3531a8eb928ab001908ab7147499f818cfac820bd35074d86")
          ]
          for name,repo,kind,rev,filename,archive_hash,pth_hash in cases:
              p=next(x for x in config["presets"].values() if x["shortcut"]==name)
              fingerprint=p["rvc"]["stage02_model_fingerprint"]
              path=hf_hub_download(repo,filename,repo_type=kind,revision=rev)
              with open(path,"rb") as f: assert hashlib.file_digest(f,"sha256").hexdigest()==archive_hash
              with zipfile.ZipFile(path) as z:
                  for ext in (".pth",".index"):
                      members=[n for n in z.namelist() if n.endswith(ext) and (ext==".pth" or name=="F6" or pathlib.PurePosixPath(n).name.startswith("added_"))]
                      assert len(members)==1
                      target=pathlib.Path(name+ext)
                      with z.open(members[0]) as src,target.open("wb") as dst: shutil.copyfileobj(src,dst)
                      with target.open("rb") as f: assert hashlib.file_digest(f,"sha256").hexdigest()==fingerprint[ext[1:]+"_sha256"]
                      print("ORIGINAL_HASH_PASS",name,ext,flush=True)
          for ext in (".pth",".index"):
              src=hf_hub_download("John6666/mikuTTS","weights/D/D"+ext,repo_type="space",revision="28d67856b353a962e4916523ba94154e88c3fad6")
              target=pathlib.Path("F7"+ext)
              shutil.copyfile(src,target)
              fp=next(x for x in config["presets"].values() if x["shortcut"]=="F7")["rvc"]["stage02_model_fingerprint"]
              with target.open("rb") as f: assert hashlib.file_digest(f,"sha256").hexdigest()==fp[ext[1:]+"_sha256"]
              print("ORIGINAL_HASH_PASS","F7",ext,flush=True)
          import torch
          for name in ("F6","F7","F8","F9"):
              ckpt=torch.load(name+'.pth',map_location='cpu',weights_only=True)
              with open(name+'.golden.tsv','w') as manifest:
                  for key,t in ckpt['weight'].items():
                      raw=t.detach().contiguous().reshape(-1).view(torch.uint8).numpy().tobytes()
                      print(key,t.numel(),t.element_size(),str(t.dtype).split('.')[-1],','.join(map(str,t.shape)) or '-',hashlib.sha256(raw).hexdigest(),sep='\t',file=manifest)
          shutil.copyfile(frozen,"stage04-native/VoiceBank_03_Presets.json")
          rows=[]
          for p in sorted(config["presets"].values(),key=lambda p:p["shortcut"]):
              a=p["rvc"]["parameters"]
              env=a["rms_mix_rate"] if "rms_mix_rate" in a else a["volume_envelope"]
              fp=p["rvc"]["stage02_model_fingerprint"]
              rows.append(' {"%s",%d,%.2ff,%.2ff,%.2ff,"%s","%s",%d},' % (p["shortcut"],a["pitch_shift_semitones"],a["index_rate"],a["protect"],env,fp["pth_sha256"],fp["index_sha256"],p["reference"]["sample_rate_hz"]))
          pathlib.Path("presets.inc").write_text("\n".join(rows)+"\n")
          PY
      - name: Generate official TextEncoder reference
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI.git upstream
          git -C upstream checkout 81eed5e8f68b6bed1789f682fe78cdd324495afc
          python -m pip install scipy==1.14.1 librosa==0.10.2.post1 transformers==4.49.0 faiss-cpu==1.10.0
          PYTHONPATH="$PWD/upstream" python - <<'PY'
          import torch
          from infer.module.models import TextEncoder, ResidualCouplingBlock, GeneratorNSF
          from unittest.mock import patch
          import math
          torch.set_num_threads(2)
          with torch.inference_mode():
              for name in ("F6","F7","F8","F9"):
                  ck=torch.load(name+".pth",map_location="cpu",weights_only=True)
                  cfg=ck["config"]
                  enc=TextEncoder(768,*cfg[2:8],float(cfg[8]),True).eval()
                  enc.load_state_dict({k[6:]:v for k,v in ck["weight"].items() if k.startswith("enc_p.")},strict=True)
                  flow=ResidualCouplingBlock(cfg[2],cfg[3],5,1,3,gin_channels=cfg[16]).eval()
                  flow.load_state_dict({k[5:]:v for k,v in ck["weight"].items() if k.startswith("flow.")},strict=True)
                  flow.remove_weight_norm()
                  sr=cfg[-1] if isinstance(cfg[-1],int) else int(cfg[-1].rstrip("k"))*1000
                  gen=GeneratorNSF(cfg[2],*cfg[9:15],gin_channels=cfg[16],sr=sr,is_half=False).eval()
                  gen.load_state_dict({k[4:]:v for k,v in ck["weight"].items() if k.startswith("dec.")},strict=True)
                  gen.remove_weight_norm()
                  upp=math.prod(cfg[12])
                  for t in (8,33):
                      phone=(torch.arange(t*768,dtype=torch.float32).remainder(97)-48).reshape(1,t,768)/97
                      pitch=torch.arange(t,dtype=torch.long).remainder(254).reshape(1,t)+1
                      m,logs,mask=enc(phone,pitch,torch.tensor([t-2]))
                      torch.cat((m,logs,mask),dim=1).contiguous().numpy().tofile(f"{name}.enc{t}.f32")
                      print("REFERENCE_ENCODER",name,t,m.shape,flush=True)
                      z=(torch.arange(t*cfg[2],dtype=torch.float32).remainder(67)-33).reshape(1,cfg[2],t)/67
                      g=ck["weight"]["emb_g.weight"][0].float().reshape(1,-1,1)
                      flow(z,mask,g=g,reverse=True).contiguous().numpy().tofile(f"{name}.flow{t}.f32")
                      print("REFERENCE_FLOW",name,t,flush=True)
                      z2=flow(z,mask,g=g,reverse=True)*mask
                      f0=torch.where(torch.arange(t)%4==0,0.,110.+torch.arange(t)*3).reshape(1,t)
                      noise=(torch.arange(t*upp,dtype=torch.float32).remainder(31)-15).reshape(1,t*upp,1)/15
                      with patch("torch.randn_like",return_value=noise):
                          audio=gen(z2,f0,g=g)
                      audio.contiguous().numpy().tofile(f"{name}.gen{t}.f32")
                      print("REFERENCE_GENERATOR",name,t,audio.shape,flush=True)
          PY
      - name: Generate official RMVPE reference from original checkpoint
        run: |
          PYTHONPATH="$PWD/upstream" python - <<'PY'
          import torch, hashlib, shutil, pathlib
          from huggingface_hub import hf_hub_download
          from infer.rmvpe import RMVPE
          src=hf_hub_download("lj1995/VoiceConversionWebUI","rmvpe.pt",revision="0d7ebae")
          shutil.copyfile(src,"rmvpe.pt")
          with open("rmvpe.pt","rb") as f:
              digest=hashlib.file_digest(f,"sha256").hexdigest()
              assert digest=="6d62215f4306e3ca278246188607209f09af3dc77ed4232efdd069798c4ec193"
              print("RMVPE_ORIGINAL_SHA256",digest,flush=True)
          torch.set_num_threads(2)
          model=RMVPE("rmvpe.pt",False,"cpu")
          with torch.inference_mode():
              a=torch.arange(5120,dtype=torch.float32)/16000
              x=(torch.sin(a*2*3.141592653589793*123)*0.2+torch.sin(a*2*3.141592653589793*246)*0.06).reshape(1,-1)
              x[:,0:800]=0
              mel=model.extract_mel(x)
              hidden=model.mel2hidden(mel)
              f0=model.decode(hidden.squeeze(0).numpy(),thred=0.03)
              for key,val in (("input",x),("mel",mel),("hidden",hidden),("f0",torch.from_numpy(f0))):
                  val.float().contiguous().numpy().tofile("rmvpe."+key+".f32")
              print("RMVPE_REFERENCE",list(mel.shape),list(hidden.shape),flush=True)
          PY
      - name: Generate official HuBERT reference from unchanged distributed checkpoint
        run: |
          PYTHONPATH="$PWD/upstream" python - <<'PY'
          import hashlib, pathlib, torch, shutil
          from huggingface_hub import snapshot_download
          from infer.hubert import load_hubert_model,extract_hubert_features
          dest=pathlib.Path("upstream/assets")
          snapshot_download("lj1995/VoiceConversionWebUI",revision="1be9d36",allow_patterns=["hubert_base/*"],local_dir=dest)
          src=dest/"hubert_base/pytorch_model.bin"
          with src.open("rb") as f:
              assert hashlib.file_digest(f,"sha256").hexdigest()=="cc8c20f4b90a520757260197a3ff2505705a7adbd20ad9eeaa4e1a9b38442ef5"
          shutil.copyfile(src,"hubert.bin")
          torch.set_num_threads(2)
          model=load_hubert_model("cpu",False)
          import numpy as np
          x=torch.from_numpy(np.fromfile("rmvpe.input.f32",dtype=np.float32)).reshape(1,-1)
          with torch.inference_mode():
              for v in ("v1","v2"):
                  y=extract_hubert_features(model,x,v)
                  y.float().contiguous().numpy().tofile("hubert."+v+".f32")
                  print("HUBERT_REFERENCE",v,list(y.shape),flush=True)
          from huggingface_hub import hf_hub_download
          from infer.hubert import HubertModelWithFinalProj
          d=pathlib.Path("applio-contentvec");d.mkdir(exist_ok=True)
          for file in ("config.json","pytorch_model.bin"):
              p=hf_hub_download("IAHispano/Applio","Resources/embedders/contentvec/"+file,revision="af1e177")
              shutil.copyfile(p,d/file)
          with (d/"pytorch_model.bin").open("rb") as f: assert hashlib.file_digest(f,"sha256").hexdigest()=="d8dd400e054ddf4e6be75dab5a2549db748cc99e756a097c496c099f65a4854e"
          shutil.copyfile(d/"pytorch_model.bin","applio_contentvec.bin")
          model=HubertModelWithFinalProj.from_pretrained(d,local_files_only=True).eval()
          with torch.inference_mode():
              y=model(x).last_hidden_state
              y.float().contiguous().numpy().tofile("applio.hubert.v2.f32")
          PY
      - name: Generate end-to-end neural reference with same unchanged source and model
        run: |
          PYTHONPATH="$PWD/upstream" python - <<'PY'
          import torch,numpy as np,math,faiss,json,librosa
          from infer.module.models import TextEncoder,ResidualCouplingBlock,GeneratorNSF
          from unittest.mock import patch
          from infer.rmvpe import RMVPE
          torch.set_num_threads(2)
          feats=torch.from_numpy(np.fromfile("hubert.v2.f32",dtype=np.float32)).reshape(1,-1,768)
          f0=np.fromfile("rmvpe.f0.f32",dtype=np.float32)
          voiced=f0>0
          if voiced.any(): f0[~voiced]=np.interp(np.flatnonzero(~voiced),np.flatnonzero(voiced),f0[voiced])
          x=np.fromfile("rmvpe.input.f32",dtype=np.float32)
          original_f0=np.fromfile("rmvpe.f0.f32",dtype=np.float32)
          scaled=x.copy();q=np.quantile(np.abs(scaled),0.999)
          if q>0: scaled/=q
          f6_f0=RMVPE("rmvpe.pt",False,"cpu").infer_from_audio(scaled,thred=0.03)
          for name in ("F6","F7","F8","F9"):
              ck=torch.load(name+".pth",map_location="cpu",weights_only=True);cfg=ck["config"]
              import json
              params=next(p["rvc"]["parameters"] for p in json.load(open("frozen/VoiceBank_03_Presets.json"))["presets"].values() if p["shortcut"]==name)
              pitch=params["pitch_shift_semitones"];rate=params["index_rate"]
              input_feats=torch.from_numpy(np.fromfile("applio.hubert.v2.f32",dtype=np.float32)).reshape(1,-1,768) if name=="F6" else feats
              orig=input_feats.clone()
              if rate:
                  index=faiss.read_index(name+".index")
                  vec=index.reconstruct_n(0,index.ntotal)
                  score,ix=index.search(input_feats[0].numpy(),8)
                  assert (ix>=0).all() and np.isfinite(score).all()
                  zero=score==0
                  weight=np.where(zero.any(axis=1,keepdims=True),zero.astype(np.float64),1/np.maximum(score.astype(np.float64),1e-30)**2)
                  weight/=weight.sum(axis=1,keepdims=True)
                  retrieved=np.sum(vec[ix]*weight[:,:,None],axis=1).astype(np.float32)
                  input_feats=torch.from_numpy(retrieved).unsqueeze(0)*rate+input_feats*(1-rate)
                  input_feats.contiguous().numpy().tofile(name+".retrieved.f32")
              fine=f6_f0 if name=="F6" else f0
              t=min(input_feats.shape[1]*2,len(fine),len(x)//160)
              phone=input_feats.repeat_interleave(2,dim=1)[:,:t]
              original=orig.repeat_interleave(2,dim=1)[:,:t]
              pf=torch.from_numpy(fine[:t].copy()).float().reshape(1,t)*2**(pitch/12)
              if params["protect"]<0.5 and rate:
                  a=torch.where(pf<1,params["protect"],1.).unsqueeze(-1)
                  phone=phone*a+original*(1-a)
              phone.contiguous().numpy().tofile(name+".phone.f32")
              pf.contiguous().numpy().tofile(name+".pitchf.f32")
              enc=TextEncoder(768,*cfg[2:8],float(cfg[8]),True).eval()
              flow=ResidualCouplingBlock(cfg[2],cfg[3],5,1,3,gin_channels=cfg[16]).eval()
              sr=cfg[-1] if isinstance(cfg[-1],int) else int(cfg[-1].rstrip("k"))*1000
              gen=GeneratorNSF(cfg[2],*cfg[9:15],gin_channels=cfg[16],sr=sr,is_half=False).eval()
              for model,prefix in [(enc,"enc_p."),(flow,"flow."),(gen,"dec.")]:
                  model.load_state_dict({k[len(prefix):]:v for k,v in ck["weight"].items() if k.startswith(prefix)},strict=True)
              flow.remove_weight_norm();gen.remove_weight_norm()
              with torch.inference_mode():
                  m=1127*torch.log1p(pf/700)
                  a=1127*math.log(1+50/700);b=1127*math.log(1+1100/700)
                  coarse=torch.where(m>0,(m-a)*254/(b-a)+1,m).clamp(1,255).round().long()
                  mu,logs,mask=enc(phone,coarse,torch.tensor([t]))
                  noise=(torch.arange(mu.numel(),dtype=torch.float32).remainder(37)-18).reshape_as(mu)/18
                  z=flow((mu+logs.exp()*noise*0.66666)*mask,mask,g=ck["weight"]["emb_g.weight"][0].float().reshape(1,-1,1),reverse=True)*mask
                  upp=math.prod(cfg[12]);exc=(torch.arange(t*upp,dtype=torch.float32).remainder(31)-15).reshape(1,t*upp,1)/15
                  with patch("torch.randn_like",return_value=exc):
                      y=gen(z,pf,g=ck["weight"]["emb_g.weight"][0].float().reshape(1,-1,1))
                  y.contiguous().numpy().tofile(name+".pipeline.f32")
                  if name=="F7":
                      a=librosa.feature.rms(y=x,frame_length=16000,hop_length=8000)
                      b=librosa.feature.rms(y=y.reshape(-1).numpy(),frame_length=sr,hop_length=sr//2)
                      a=torch.nn.functional.interpolate(torch.from_numpy(a).unsqueeze(0),size=y.numel(),mode="linear",align_corners=False)
                      b=torch.nn.functional.interpolate(torch.from_numpy(b).unsqueeze(0),size=y.numel(),mode="linear",align_corners=False).clamp_min(1e-6)
                      (y*a.pow(0.75)*b.pow(-0.75)).contiguous().numpy().tofile(name+".rms.f32")
                  print("REFERENCE_PIPELINE",name,t,sr,y.shape,flush=True)
          PY
      - name: Build and test host real-time transport
        run: |
          cat > rt_audio.hpp <<'EOF'
          #pragma once
          #include <array>
          #include <atomic>
          #include <algorithm>
          #include <filesystem>
          #include <thread>
          #include <openssl/evp.h>
          #include <cmath>
          #include <cstdint>
          #include <cstddef>
          #include <type_traits>
          namespace voicebank {
          constexpr int host_rate=48000,feature_rate=16000;
          constexpr size_t host_hop=480,feature_hop=160,history_frames=5120;
          constexpr size_t internal_delay=720; // 15 ms scheduling target, not measured physical latency
          constexpr float pi=3.14159265358979323846f;
          static_assert(std::atomic<uint64_t>::is_always_lock_free);
          static_assert(std::atomic<unsigned>::is_always_lock_free);
          struct InputFrame {uint64_t first;std::array<float,host_hop> samples;};
          struct OutputFrame {uint64_t first;std::array<float,host_hop> samples;};
          template<class T,size_t N> struct Spsc {
           static_assert((N&(N-1))==0&&N>0);
           static_assert(std::is_trivially_copyable_v<T>);
           std::array<T,N> data{};
           alignas(64) std::atomic<uint64_t> write{0};
           alignas(64) std::atomic<uint64_t> read{0};
           bool push(const T& item) noexcept {
            auto w=write.load(std::memory_order_relaxed);
            if(w-read.load(std::memory_order_acquire)>=N)return false;
            data[w&(N-1)]=item;write.store(w+1,std::memory_order_release);return true;
           }
           bool pop(T& item) noexcept {
            auto r=read.load(std::memory_order_relaxed);
            if(r==write.load(std::memory_order_acquire))return false;
            item=data[r&(N-1)];read.store(r+1,std::memory_order_release);return true;
           }
          };
          struct Counters {std::atomic<uint64_t> input_overrun{0},output_overrun{0},underrun_samples{0},late_samples{0},worker_failures{0},discontinuities{0};};
          class AudioBridge {
           Spsc<InputFrame,32> in_;
           Spsc<OutputFrame,32> out_;
           InputFrame building_{};
           OutputFrame pending_{};
           size_t input_fill_=0,pending_at_=host_hop;
           uint64_t cursor_=0;
           public:
           Counters counts;
           std::atomic<uint64_t> published_cursor{0};
           std::atomic<unsigned> selected{0};
           void callback(const float* input,float* output,size_t n) noexcept {
            for(size_t i=0;i<n;++i){
             auto seq=cursor_++;
             if(input_fill_==0)building_.first=seq;
             building_.samples[input_fill_++]=std::isfinite(input[i])?input[i]:0.0f;
             if(input_fill_==host_hop){if(!in_.push(building_))counts.input_overrun.fetch_add(1,std::memory_order_relaxed);input_fill_=0;}
             output[i]=0;
             if(seq<internal_delay)continue;
             auto wanted=seq-internal_delay;
             bool emitted=false;
             while(true){
              if(pending_at_==host_hop){if(!out_.pop(pending_))break;pending_at_=0;}
              uint64_t available=pending_.first+pending_at_;
              if(available<wanted){
               auto skip=std::min<uint64_t>(host_hop-pending_at_,wanted-available);
               pending_at_+=size_t(skip);counts.late_samples.fetch_add(skip,std::memory_order_relaxed);continue;
              }
              if(available==wanted){output[i]=pending_.samples[pending_at_++];emitted=true;break;}
              break;
             }
             if(!emitted)counts.underrun_samples.fetch_add(1,std::memory_order_relaxed);
            }
            published_cursor.store(cursor_,std::memory_order_release);
           }
           bool take(InputFrame& frame) noexcept{return in_.pop(frame);}
           bool submit(const OutputFrame& frame) noexcept {
            if(!out_.push(frame)){counts.output_overrun.fetch_add(1,std::memory_order_relaxed);return false;}return true;
           }
          };
          class Decimator3 {
           static constexpr int taps=63;
           std::array<float,taps> h_{},samples_{};int pos_=0,phase_=0;
           public:
           Decimator3(){double sum=0;constexpr double fc=0.145;
            for(int i=0;i<taps;++i){double x=i-(taps-1)*0.5;
             double s=x==0?2*fc:std::sin(2*pi*fc*x)/(pi*x);
             double w=.42-.5*std::cos(2*pi*i/(taps-1))+.08*std::cos(4*pi*i/(taps-1));h_[i]=float(s*w);sum+=h_[i];}
            for(auto& a:h_)a=float(a/sum);
           }
           void reset() noexcept{samples_.fill(0);pos_=phase_=0;}
           void run(const std::array<float,host_hop>& in,std::array<float,feature_hop>& out) noexcept{
            size_t j=0;for(float x:in){samples_[pos_]=x;pos_=(pos_+1)%taps;
             if(++phase_==3){phase_=0;double v=0;int p=pos_;for(int k=0;k<taps;++k){p=(p+taps-1)%taps;v+=h_[k]*samples_[p];}out[j++]=float(v);}}
           }
          };
          class SharedHistory {
           Decimator3 decimator_;
           std::array<float,history_frames> buf_{};
           std::array<float,feature_hop> newest_{};
           public:
           void reset() noexcept{buf_.fill(0);decimator_.reset();}
           const std::array<float,history_frames>& append(const InputFrame& frame) noexcept {
            decimator_.run(frame.samples,newest_);
            std::move(buf_.begin()+feature_hop,buf_.end(),buf_.begin());
            std::copy(newest_.begin(),newest_.end(),buf_.end()-feature_hop);
            return buf_;
           }
          };
          class TailResampler {
           static constexpr int half=16;
           std::array<std::array<float,2*half>,6> coeff_{};
           public:
           TailResampler(){for(int phase=0;phase<6;++phase){double s=0;double frac=phase/6.;for(int k=0;k<2*half;++k){double x=k-(half-1)-frac;double a=std::abs(x)/half;double w=a>=1?0:.5+.5*std::cos(pi*a);double sinc=x==0?1:std::sin(pi*x)/(pi*x);coeff_[phase][k]=float(w*sinc);s+=coeff_[phase][k];}for(auto& v:coeff_[phase])v=float(v/s);}}
           bool run(const float* source,size_t count,int sr,std::array<float,host_hop>& out) const noexcept {
            if(sr==48000){if(count<host_hop)return false;std::copy_n(source+count-host_hop,host_hop,out.begin());return true;}
            if(sr!=40000||count<400+2*half)return false;
            const int64_t begin=int64_t(count)-400-half;
            for(int i=0;i<int(host_hop);++i){int n=i*5;int64_t center=begin+n/6;int phase=n%6;double y=0;
             for(int k=0;k<2*half;++k){int64_t at=center+k-(half-1);if(at<0||at>=int64_t(count))return false;y+=source[at]*coeff_[phase][k];}out[i]=float(y);}
            return true;
           }
          };
          // Experimental causal RMS. It is NOT the centered offline RMS reference.
          // The comparison and quality gate must pass before release.
          class CausalEnvelope {
           static constexpr int blocks=100;
           std::array<double,blocks> x_{},y_{};
           double sx_=0,sy_=0;int p_=0;float prev_=1;
           public:
           void reset() noexcept{x_.fill(0);y_.fill(0);sx_=sy_=0;p_=0;prev_=1;}
           void run(const InputFrame& input,OutputFrame& output,float mix) noexcept {
            if(mix>=1)return;
            double a=0,b=0;for(size_t i=0;i<host_hop;++i){a+=double(input.samples[i])*input.samples[i];b+=double(output.samples[i])*output.samples[i];}
            sx_+=a-x_[p_];sy_+=b-y_[p_];x_[p_]=a;y_[p_]=b;p_=(p_+1)%blocks;
            double rms1=std::sqrt(std::max(0.,sx_)/(blocks*host_hop)),rms2=std::sqrt(std::max(0.,sy_)/(blocks*host_hop));
            float target=float(std::pow(rms1/std::max(rms2,1e-6),1-mix));
            for(size_t i=0;i<host_hop;++i)output.samples[i]*=prev_+(target-prev_)*float(i+1)/host_hop;
            prev_=target;
           }
          };
          class SwitchJoin {
           bool valid_=false;unsigned previous_=0;float last_=0;
           public:
           void reset()noexcept{valid_=false;last_=0;}
           void run(unsigned voice,std::array<float,host_hop>& out) noexcept {
            if(valid_&&previous_!=voice){constexpr size_t n=96;float first=out[0];for(size_t i=0;i<n;++i){float t=float(i+1)/n;float fade=.5f-.5f*std::cos(pi*t);out[i]+=(last_-first)*(1-fade);}}
            last_=out.back();previous_=voice;valid_=true;
           }
          };
          } // namespace voicebank
          EOF
