          // The distributed RVC HuBERT config is group-norm CNN, post-norm 12-layer encoder, 768 channels.
          struct NativeHubert {
           std::unordered_map<std::string,at::Tensor> w;
           at::Tensor pos_weight;
           explicit NativeHubert(const std::string& path){
            caffe2::serialize::PyTorchStreamReader reader(path);
            auto root=load_original(reader).toGenericDict();
            for(auto& kv:root)if(kv.value().isTensor())w.emplace(kv.key().toStringRef(),kv.value().toTensor().to(at::kFloat));
            const std::string k="encoder.pos_conv_embed.conv";
            if(w.count(k+".weight"))pos_weight=W(k+".weight");
            else if(w.count(k+".parametrizations.weight.original0"))pos_weight=at::_weight_norm(W(k+".parametrizations.weight.original1"),W(k+".parametrizations.weight.original0"),2);
            else pos_weight=at::_weight_norm(W(k+".weight_v"),W(k+".weight_g"),2);
           }
           const at::Tensor& W(const std::string& k)const{return w.at(k);}
           at::Tensor norm(const at::Tensor& x,const std::string& k)const{return at::layer_norm(x,{x.size(-1)},W(k+".weight"),W(k+".bias"),1e-5,true);}
           at::Tensor linear(const at::Tensor& x,const std::string& k)const{return at::linear(x,W(k+".weight"),W(k+".bias"));}
           at::Tensor forward(const at::Tensor& input,bool v1=false)const{
            auto x=input.unsqueeze(1);
            for(int i=0;i<7;++i){
             auto k="feature_extractor.conv_layers."+std::to_string(i);
             x=at::conv1d(x,W(k+".conv.weight"),std::nullopt,at::IntArrayRef{i==0?5:2},at::IntArrayRef{0},at::IntArrayRef{1},1);
             if(i==0)x=at::group_norm(x,512,W(k+".layer_norm.weight"),W(k+".layer_norm.bias"),1e-5,true);
             x=at::gelu(x,"none");
            }
            x=linear(norm(x.transpose(1,2),"feature_projection.layer_norm"),"feature_projection.projection");
            auto pos=at::conv1d(x.transpose(1,2),pos_weight,W("encoder.pos_conv_embed.conv.bias"),at::IntArrayRef{1},at::IntArrayRef{64},at::IntArrayRef{1},16).slice(-1,0,x.size(1));
            x=norm(x+at::gelu(pos,"none").transpose(1,2),"encoder.layer_norm");
            for(int i=0;i<(v1?9:12);++i){
             auto k="encoder.layers."+std::to_string(i),a=k+".attention";
             auto b=x.size(0),t=x.size(1);
             auto q=linear(x,a+".q_proj").reshape({b,t,12,64}).transpose(1,2)*0.125;
             auto key=linear(x,a+".k_proj").reshape({b,t,12,64}).transpose(1,2);
             auto v=linear(x,a+".v_proj").reshape({b,t,12,64}).transpose(1,2);
             auto att=at::matmul(at::softmax(at::matmul(q,key.transpose(-1,-2)),-1),v).transpose(1,2).contiguous().reshape({b,t,768});
             x=norm(x+linear(att,a+".out_proj"),k+".layer_norm");
             auto ff=linear(at::gelu(linear(x,k+".feed_forward.intermediate_dense"),"none"),k+".feed_forward.output_dense");
             x=norm(x+ff,k+".final_layer_norm");
            }
            return (v1?linear(x,"final_proj"):x).contiguous();
           }
          };
