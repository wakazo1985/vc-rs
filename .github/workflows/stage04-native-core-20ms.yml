          }
          std::string digest_tensor(const at::Tensor& t){
           auto b=t.contiguous();
           unsigned char digest[SHA256_DIGEST_LENGTH];
           SHA256(static_cast<const unsigned char*>(b.data_ptr()),b.nbytes(),digest);
           std::ostringstream out;
           for(auto x:digest)out<<std::hex<<std::setw(2)<<std::setfill('0')<<int(x);
           return out.str();
          }
          struct TextEncoder {
           std::unordered_map<std::string,at::Tensor> w;
           int64_t hidden,heads,layers,inter;
           explicit TextEncoder(const c10::impl::GenericDict& root){
            auto config=root.at(c10::IValue("config"));auto cfg=config.toListRef();
            inter=cfg[2].toInt();hidden=cfg[3].toInt();heads=cfg[5].toInt();layers=cfg[6].toInt();
            auto weights=root.at(c10::IValue("weight")).toGenericDict();
            for(auto& kv:weights){auto key=kv.key().toStringRef();if(key.rfind("enc_p.",0)==0)w.emplace(key.substr(6),kv.value().toTensor().to(at::kFloat));}
            require(hidden%heads==0,"encoder head geometry");
           }
           const at::Tensor& W(const std::string& k)const{return w.at(k);}
           at::Tensor conv(const at::Tensor& x,const std::string& k,bool pad=false)const{
            auto a=W(k+".weight");auto n=a.size(2);
            return at::conv1d(pad?at::constant_pad_nd(x,{(n-1)/2,n/2},0):x,a,W(k+".bias"),at::IntArrayRef{1},at::IntArrayRef{0},at::IntArrayRef{1},1);
           }
           at::Tensor norm(const at::Tensor& x,const std::string& k)const{
            return at::layer_norm(x.transpose(1,2),{hidden},W(k+".gamma"),W(k+".beta"),1e-5,true).transpose(1,2);
           }
           at::Tensor relative(const at::Tensor& x,int64_t t)const{
            auto win=(x.size(1)-1)/2;auto pad=std::max<int64_t>(t-win-1,0);auto start=std::max<int64_t>(win+1-t,0);
            return at::constant_pad_nd(x,{0,0,pad,pad},0).slice(1,start,start+2*t-1);
           }
           at::Tensor attention(const at::Tensor& x,const at::Tensor& mask,const std::string& k)const{
            auto b=x.size(0),t=x.size(2),d=hidden/heads;
            auto q=conv(x,k+".conv_q").reshape({b,heads,d,t}).transpose(2,3)/std::sqrt(double(d));
            auto key=conv(x,k+".conv_k").reshape({b,heads,d,t}).transpose(2,3);
            auto v=conv(x,k+".conv_v").reshape({b,heads,d,t}).transpose(2,3);
            auto score=at::matmul(q,key.transpose(-2,-1));
            auto r=at::matmul(q,relative(W(k+".emb_rel_k"),t).unsqueeze(0).transpose(-2,-1));
            r=at::constant_pad_nd(r,{0,1},0).reshape({b,heads,2*t*t});
            r=at::constant_pad_nd(r,{0,t-1},0).reshape({b,heads,t+1,2*t-1}).slice(2,0,t).slice(3,t-1,2*t-1);
            auto p=at::softmax((score+r).masked_fill((mask.unsqueeze(2)*mask.unsqueeze(-1)).eq(0),-1e4),-1);
            auto out=at::matmul(p,v);
            r=at::constant_pad_nd(p,{0,t-1},0).reshape({b,heads,2*t*t-t});
            r=at::constant_pad_nd(r,{t,0},0).reshape({b,heads,t,2*t}).slice(3,1,2*t);
            out=out+at::matmul(r,relative(W(k+".emb_rel_v"),t).unsqueeze(0));
            return conv(out.transpose(2,3).contiguous().reshape({b,hidden,t}),k+".conv_o");
           }
           at::Tensor forward(const at::Tensor& phone,const at::Tensor& pitch,const at::Tensor& lengths)const{
            auto t=phone.size(1);
            auto x=at::linear(phone,W("emb_phone.weight"),W("emb_phone.bias"))+at::embedding(W("emb_pitch.weight"),pitch,-1,false,false);
            x=at::leaky_relu(x*std::sqrt(double(hidden)),0.1).transpose(1,2);
            auto mask=at::arange(t,lengths.options()).unsqueeze(0).lt(lengths.unsqueeze(1)).unsqueeze(1).to(x.scalar_type());
            x=x*mask;
            for(int i=0;i<layers;++i){
             auto n=std::to_string(i);
             x=norm(x+attention(x,mask,"encoder.attn_layers."+n),"encoder.norm_layers_1."+n);
             auto y=at::relu(conv(x*mask,"encoder.ffn_layers."+n+".conv_1",true));
             y=conv(y*mask,"encoder.ffn_layers."+n+".conv_2",true)*mask;
             x=norm(x+y,"encoder.norm_layers_2."+n);
            }
            auto stats=conv(x*mask,"proj")*mask;require(stats.size(1)==2*inter,"encoder projection");
            return at::cat({stats,mask},1).contiguous();
           }
          };
          void verify_encoder(const c10::impl::GenericDict& root,const std::string& name){
           at::NoGradGuard guard;
