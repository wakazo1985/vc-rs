          // Shared feature and pitch engines, per-model preloaded synthesizer; no file I/O in forward.
          struct NeuralPipeline {
           TextEncoder enc;ReverseFlow flow;Generator gen;
           const Preset& preset;
           NeuralPipeline(const c10::impl::GenericDict& root,const Preset& p):enc(root),flow(root),gen(root),preset(p){}
           static at::Tensor interpolate_f0(const at::Tensor& f){
            auto idx=at::arange(f.numel(),f.options().dtype(at::kLong));
            auto voiced=f.gt(0);
            auto left=std::get<0>(at::cummax(at::where(voiced,idx,at::full_like(idx,-1)),0));
            auto right=at::flip(std::get<0>(at::cummin(at::flip(at::where(voiced,idx,at::full_like(idx,f.numel())),{0}),0)),{0});
            auto l=at::where(left.ge(0),left,right).clamp(0,f.numel()-1);
            auto r=at::where(right.lt(f.numel()),right,left).clamp(0,f.numel()-1);
            auto frac=(idx-l).to(f.scalar_type())/(r-l).clamp_min(1).to(f.scalar_type());
            auto interp=f.index_select(0,l)+(f.index_select(0,r)-f.index_select(0,l))*frac;
            return at::where(voiced,f,interp);
           }
           void move_to(const at::Device& dev){for(auto* p:{&enc.w,&flow.w,&gen.w})for(auto& kv:*p)kv.second=kv.second.to(dev);}
           at::Tensor synthesize(const at::Tensor& features,const at::Tensor& f0,int64_t input_len,bool deterministic,int64_t tail_frames=0,at::Tensor retrieved={})const{
            require(preset.index==0.f||retrieved.defined(),"nonzero index needs retrieved features");
            auto base=tail_frames>0?at::cat({features,features.slice(1,features.size(1)-1,features.size(1))},1):features;
            auto phone=base.repeat_interleave(2,1);
            auto t=std::min({phone.size(1),f0.numel(),input_len/160});
            require(t>0,"insufficient frames");
            phone=phone.slice(1,0,t);
            auto pf=(std::string(preset.name)=="F6"?f0:interpolate_f0(f0)).slice(0,0,t).reshape({1,t})*std::pow(2.,preset.pitch/12.);
            if(retrieved.defined()){
             auto r=tail_frames>0?at::cat({retrieved,retrieved.slice(1,retrieved.size(1)-1,retrieved.size(1))},1):retrieved;
             r=r.repeat_interleave(2,1).slice(1,0,t);
             if(preset.protect<0.5f){
              auto a=at::where(pf.lt(1),at::full_like(pf,preset.protect),at::ones_like(pf)).unsqueeze(-1);
              phone=r*a+phone*(1-a);
             }else phone=r;
            }
            auto m=1127*at::log1p(pf/700);
            double lo=1127*std::log(1+50./700),hi=1127*std::log(1+1100./700);
            auto coarse=at::where(m.gt(0),(m-lo)*254/(hi-lo)+1,m).clamp(1,255).round().to(at::kLong);
            auto stats=enc.forward(phone,coarse,at::full({1},t,coarse.options()));
            auto mu=stats.slice(1,0,enc.inter),logs=stats.slice(1,enc.inter,2*enc.inter),mask=stats.slice(1,2*enc.inter,2*enc.inter+1);
            const auto head=tail_frames>0?std::max<int64_t>(t-tail_frames,0):0;
            const auto flow_head=std::max<int64_t>(head-24,0);
            mu=mu.slice(2,flow_head,t);logs=logs.slice(2,flow_head,t);mask=mask.slice(2,flow_head,t);
            auto latent=deterministic?(at::arange(mu.numel(),mu.options()).remainder(37)-18).reshape(mu.sizes())/18:at::randn_like(mu);
            auto z=flow.forward((mu+logs.exp()*latent*0.66666)*mask,mask,0)*mask;
            z=z.slice(2,head-flow_head,t-flow_head);pf=pf.slice(1,head,t);
            const auto samples=(t-head)*gen.upp;
            auto noise=deterministic?(at::arange(samples,pf.options()).remainder(31)-15).reshape({1,samples,1})/15:at::randn({1,samples,1},pf.options());
            return gen.forward(z,pf,noise,0);
           }
          };
