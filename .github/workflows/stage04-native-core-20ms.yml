          std::string file_sha256(const std::string& name){
           std::ifstream in(std::filesystem::u8path(name),std::ios::binary);require(bool(in),"original file missing");
           std::unique_ptr<EVP_MD_CTX,decltype(&EVP_MD_CTX_free)> ctx(EVP_MD_CTX_new(),EVP_MD_CTX_free);
           require(bool(ctx)&&EVP_DigestInit_ex(ctx.get(),EVP_sha256(),nullptr)==1,"SHA-256 init");
           std::array<char,65536> buffer{};
           while(in){in.read(buffer.data(),buffer.size());auto n=in.gcount();if(n>0)require(EVP_DigestUpdate(ctx.get(),buffer.data(),size_t(n))==1,"SHA-256 update");}
           require(in.eof(),"file read error");
           unsigned char digest[EVP_MAX_MD_SIZE];unsigned n=0;
           require(EVP_DigestFinal_ex(ctx.get(),digest,&n)==1&&n==32,"SHA-256 finish");
           std::ostringstream out;for(unsigned i=0;i<n;++i)out<<std::hex<<std::setw(2)<<std::setfill('0')<<int(digest[i]);return out.str();
          }
          std::string checked_asset(const std::filesystem::path& root,const std::string& name,const char* expected){
           auto p=(root/name).u8string();require(file_sha256(p)==expected,"original SHA-256 mismatch");return p;
          }
          struct Model {
           c10::IValue checkpoint;
           std::unique_ptr<faiss::Index> index;
           const Preset* preset;
           std::vector<float> index_vectors;
           Model(const Preset& p,const std::filesystem::path& dir=".",bool verify_reference=true):preset(&p){
            auto start=Clock::now();
            auto pth=checked_asset(dir,std::string(p.name)+".pth",p.pth_sha);
            auto idx=checked_asset(dir,std::string(p.name)+".index",p.index_sha);
            caffe2::serialize::PyTorchStreamReader reader(pth);
            checkpoint=load_original(reader);
            auto root=checkpoint.toGenericDict();
            auto weights=root.at(c10::IValue("weight")).toGenericDict();
            std::ifstream golden;
            if(verify_reference){golden.open(dir/(std::string(p.name)+".golden.tsv"));require(bool(golden),"missing golden manifest");}
            struct TensorMeta{long long n,b;std::string dtype,shape,hash;};
            std::unordered_map<std::string,TensorMeta> hashes;
            std::string key;TensorMeta meta;
            while(verify_reference && golden>>key>>meta.n>>meta.b>>meta.dtype>>meta.shape>>meta.hash) require(hashes.emplace(key,meta).second,"duplicate tensor");
            const auto expected_count=hashes.size();
            long count=0; long long elements=0;
            for(auto& kv:weights){
             auto t=kv.value().toTensor();
             require(t.device().is_cpu(),"device mapping");
             require(at::isfinite(t).all().item<bool>(),"nonfinite");
             auto key=kv.key().toStringRef();
             if(verify_reference){
             const auto& m=hashes.at(key);
             std::ostringstream shape;
             for(int64_t i=0;i<t.dim();++i){if(i)shape<<",";shape<<t.size(i);}
             auto dtype=t.scalar_type()==at::kHalf?"float16":t.scalar_type()==at::kFloat?"float32":t.scalar_type()==at::kLong?"int64":t.scalar_type()==at::kDouble?"float64":t.scalar_type()==at::kInt?"int32":"unsupported";
             require(m.n==t.numel() && m.b==t.element_size() && m.dtype==dtype && m.shape==(t.dim()?shape.str():"-") && m.hash==digest_tensor(t),"tensor metadata or bytes mismatch");
             hashes.erase(key);
             }
             ++count;elements+=t.numel();
            }
            require(count>0&&(!verify_reference||(size_t(count)==expected_count&&hashes.empty())),"unexpected tensor count");
            index.reset(faiss::read_index(idx.c_str()));
            require(index && index->d==768 && index->ntotal>=8,"invalid original index");
            if(p.index!=0.f){
             index_vectors.resize(size_t(index->ntotal)*index->d);
             index->reconstruct_n(0,index->ntotal,index_vectors.data());
            }
            std::cout<<"MODEL "<<p.name<<" exact_tensor_hashes="<<(verify_reference?count:0)<<" tensors="<<count<<" elements="<<elements<<" index_count="<<index->ntotal<<" preload_ms="<<ms(start)<<std::endl;
           }
           // Caller supplies preallocated output. Retrieval at 50 Hz, then Protect at 100 Hz.
           void mix(const float* x,float* out,float rate)const{
            if(rate==0.f){std::copy_n(x,768,out);return;}
            require(!index_vectors.empty(),"index vectors not preloaded");
            std::array<float,8> d{};std::array<faiss::idx_t,8> ids{};
            index->search(1,x,8,d.data(),ids.data());
            int zeros=0;
            for(int i=0;i<8;++i){require(ids[i]>=0 && ids[i]<index->ntotal && std::isfinite(d[i]) && d[i]>=0,"invalid index distance");if(d[i]==0)++zeros;}
            double total=0;std::array<double,8> w{};
            for(int i=0;i<8;++i){w[i]=zeros?(d[i]==0?1.0:0.0):1.0/(double(d[i])*d[i]);total+=w[i];}
            for(int j=0;j<768;++j){
             double sum=0;for(int i=0;i<8;++i)sum+=(w[i]/total)*index_vectors[size_t(ids[i])*768+j];
             out[j]=float(sum)*rate+x[j]*(1-rate);
            }
           }
           void protect_upsampled(const float* original,const float* retrieved,const float* pitchf,size_t frames,float* out)const{
            for(size_t t=0;t<frames;++t){
             const float a=preset->protect<0.5f && pitchf[t]<1.f?preset->protect:1.f;
             for(int j=0;j<768;++j){size_t k=(t/2)*768+j;out[t*768+j]=retrieved[k]*a+original[k]*(1-a);}
            }
           }
          };
          // Batch retrieval scratch is allocated at initialization. CPU search is outside CUDA Graph.
          struct RetrievalScratch {
           std::vector<float> distances;
           std::vector<faiss::idx_t> ids;
           explicit RetrievalScratch(int64_t frames):distances(frames*8),ids(frames*8){}
           void run(const Model& m,const at::Tensor& h,at::Tensor& result){
            require(h.device().is_cpu()&&result.device().is_cpu()&&h.is_contiguous()&&result.is_contiguous(),"retrieval needs contiguous CPU tensors");
            require(h.sizes()==result.sizes()&&h.size(0)==1&&h.size(2)==768,"retrieval shape");
            if(m.preset->index==0.f){result.copy_(h);return;}
            int64_t n=h.size(1);
            require(size_t(n*8)<=distances.size(),"retrieval scratch too small");
            const float* x=h.data_ptr<float>();float* out=result.data_ptr<float>();
            m.index->search(n,x,8,distances.data(),ids.data());
            for(int64_t t=0;t<n;++t){
             auto d=distances.data()+t*8;auto ix=ids.data()+t*8;
             std::array<double,8> w{};int zeros=0;double total=0;
             for(int k=0;k<8;++k){require(ix[k]>=0&&ix[k]<m.index->ntotal&&std::isfinite(d[k])&&d[k]>=0,"invalid retrieval neighbor");zeros+=(d[k]==0);}
             for(int k=0;k<8;++k){w[k]=zeros?(d[k]==0?1.:0.):1./(double(d[k])*d[k]);total+=w[k];}
             for(int j=0;j<768;++j){
              double sum=0;for(int k=0;k<8;++k)sum+=w[k]/total*m.index_vectors[size_t(ix[k])*768+j];
              out[t*768+j]=float(sum)*m.preset->index+x[t*768+j]*(1-m.preset->index);
             }
            }
           }
          };
          at::Tensor retrieve_features(const Model& m,const at::Tensor& h){
           if(m.preset->index==0.f)return h;
           auto cpu=h.to(at::kCPU).contiguous();auto result=at::empty_like(cpu);
           RetrievalScratch scratch(cpu.size(1));scratch.run(m,cpu,result);
           return result.to(h.device());
          }
          at::Tensor rms_adjust(const at::Tensor& x,const at::Tensor& y,int64_t sr,float rate){
           if(rate==1.f)return y;
           auto rms=[](const at::Tensor& x,int64_t sr){
            return at::constant_pad_nd(x.reshape({1,1,-1}),{sr/2,sr/2},0).unfold(-1,sr,sr/2).square().mean(-1).sqrt();
           };
           auto a=at::upsample_linear1d(rms(x,16000),at::IntArrayRef{y.numel()},false,std::optional<double>{});
           auto b=at::upsample_linear1d(rms(y,sr),at::IntArrayRef{y.numel()},false,std::optional<double>{}).clamp_min(1e-6);
           return y*a.pow(1-rate)*b.pow(rate-1);
          }
          void verify_indexed_pipeline(const Model& f6,const Model& f7){
           at::NoGradGuard guard;NativeHubert hubert("hubert.bin"),applio("applio_contentvec.bin");NativeRMVPE rmvpe("rmvpe.pt");
           auto x=fixture("rmvpe.input.f32",{1,5120});
           for(auto* m:{&f6,&f7}){
            auto h=std::string(m->preset->name)=="F6"?applio.forward(x):hubert.forward(x);
            auto a=x.abs().flatten().sort();auto sorted=std::get<0>(a);double qpos=(sorted.numel()-1)*0.999;auto lo=int64_t(std::floor(qpos));auto frac=qpos-lo;
            auto q=sorted[lo]*(1-frac)+sorted[std::min(lo+1,sorted.numel()-1)]*frac;
            auto px=std::string(m->preset->name)=="F6"?x/q.clamp_min(1e-12):x;
            auto f=rmvpe.decode(rmvpe.hidden(rmvpe.mel(px)));
            auto retrieved=retrieve_features(*m,h);
            auto name=std::string(m->preset->name);
            auto ref=fixture(name+".retrieved.f32",retrieved.sizes());
            auto err=(retrieved-ref).abs().max().item<float>();
            require(at::allclose(retrieved,ref,2e-3,2e-3),"original INDEX output mismatch");
            std::cout<<"INDEX_PARITY "<<name<<" max_abs_error="<<err<<std::endl;
            NeuralPipeline p(m->checkpoint.toGenericDict(),*m->preset);
            auto start=Clock::now();auto y=p.synthesize(h,f,x.size(-1),true,0,retrieved);auto elapsed=ms(start);
            auto expected=fixture(name+".pipeline.f32",y.sizes());
            auto e=(y-expected).abs().max().item<float>();
            std::cout<<"INDEXED_PIPELINE "<<name<<" sr="<<p.gen.sr<<" max_abs_error="<<e<<" cpu_synth_ms="<<elapsed<<std::endl;
            require(at::allclose(y,expected,2e-3,2e-3),"indexed neural fixture mismatch");
            if(m->preset->rms!=1.f){
             auto out=rms_adjust(x,y,p.gen.sr,m->preset->rms);
             auto expected_rms=fixture(name+".rms.f32",out.sizes());
             std::cout<<"RMS_PARITY "<<name<<" max_abs_error="<<(out-expected_rms).abs().max().item<float>()<<std::endl;
             require(at::allclose(out,expected_rms,2e-3,2e-3),"RMS reference mismatch");
            }
           }
          }
          #ifdef VOICEBANK_CUDA
          // Actual four-model GPU compute harness, not a host/audio end-to-end latency test.
          struct GpuVoice {
           const Model& model;
           NeuralPipeline neural;
           NativeHubert& hubert;
           NativeRMVPE& rmvpe;
           c10::cuda::CUDAStream stream;
           at::Tensor history_host,input,features,f0,retrieved,features_host,retrieved_host,output,output_host;
           std::unique_ptr<RetrievalScratch> scratch;
           std::unique_ptr<at::cuda::CUDAGraph> front,back,combined;
           bool indexed;
           static constexpr int64_t window=5120,hop=160,tail=3;
           GpuVoice(const Model& m,NativeHubert& h,NativeRMVPE& r,const at::Device& dev,c10::cuda::CUDAStream s):model(m),neural(m.checkpoint.toGenericDict(),*m.preset),hubert(h),rmvpe(r),stream(s),indexed(m.preset->index!=0.f){
            c10::cuda::CUDAStreamGuard sg(stream);
            neural.move_to(dev);
            history_host=at::zeros({1,window},at::TensorOptions().dtype(at::kFloat).pinned_memory(true));
            input=history_host.to(dev);
            auto make_front=[&](){
             auto pitch_input=input;
             if(std::string(model.preset->name)=="F6"){
              auto values=std::get<0>(input.abs().flatten().sort());
              double pos=(window-1)*0.999;auto lo=int64_t(pos);
              auto q=values[lo]*(1-(pos-lo))+values[lo+1]*(pos-lo);
              pitch_input=input/q.clamp_min(1e-12);
             }
             features=hubert.forward(input);
             f0=rmvpe.decode(rmvpe.hidden(rmvpe.mel(pitch_input)));
            };
            auto phase=at::arange(window,at::TensorOptions().dtype(at::kFloat))/16000.;
            auto fixture_input=(at::sin(phase*772.8318)*0.2+at::sin(phase*1545.6636)*0.06).reshape({1,window});
            history_host.copy_(fixture_input);input.copy_(history_host,true);stream.synchronize();
            make_front();stream.synchronize();
            if(indexed){
             features_host=at::empty(features.sizes(),at::TensorOptions().dtype(at::kFloat).pinned_memory(true));
             retrieved_host=at::empty(features.sizes(),at::TensorOptions().dtype(at::kFloat).pinned_memory(true));
             scratch=std::make_unique<RetrievalScratch>(features.size(1));
             retrieved=at::empty_like(features);
             features_host.copy_(features,true);stream.synchronize();
             scratch->run(model,features_host,retrieved_host);retrieved.copy_(retrieved_host,true);
            }
            auto synth=[&](){output=neural.synthesize(features,f0,window,false,tail,indexed?retrieved:at::Tensor{});};
            for(int i=0;i<4;++i){make_front();synth();stream.synchronize();}
            if(indexed){
             front=std::make_unique<at::cuda::CUDAGraph>();
             front->capture_begin();make_front();front->capture_end();stream.synchronize();
             back=std::make_unique<at::cuda::CUDAGraph>();
             back->capture_begin();synth();back->capture_end();stream.synchronize();
            }else{
             combined=std::make_unique<at::cuda::CUDAGraph>();
             combined->capture_begin();make_front();synth();combined->capture_end();stream.synchronize();
            }
            output_host=at::empty(output.sizes(),at::TensorOptions().dtype(at::kFloat).pinned_memory(true));
            history_host.zero_();
           }
           const at::Tensor& run_window(const float* shared){
            c10::cuda::CUDAStreamGuard sg(stream);
            auto ptr=history_host.data_ptr<float>();
            std::memcpy(ptr,shared,window*sizeof(float));
            input.copy_(history_host,true);
            if(indexed){
             front->replay();features_host.copy_(features,true);stream.synchronize();
             scratch->run(model,features_host,retrieved_host);
             retrieved.copy_(retrieved_host,true);back->replay();
            }else combined->replay();
            output_host.copy_(output,true);stream.synchronize();return output_host;
           }
          };
          void benchmark_gpu(const std::array<const Model*,4>& bank){
           at::NoGradGuard guard;at::Device dev(at::kCUDA,0);c10::cuda::CUDAGuard dg(dev);
           NativeHubert hubert("hubert.bin"),applio("applio_contentvec.bin");NativeRMVPE rmvpe("rmvpe.pt");
           for(auto* w:{&hubert.w,&applio.w,&rmvpe.w})for(auto& kv:*w)kv.second=kv.second.to(dev);
           hubert.pos_weight=hubert.pos_weight.to(dev);applio.pos_weight=applio.pos_weight.to(dev);rmvpe.basis=rmvpe.basis.to(dev);rmvpe.window=rmvpe.window.to(dev);
           require(cudaDeviceSynchronize()==cudaSuccess,"GPU preload");
           auto stream=c10::cuda::getStreamFromPool(false,0);
           std::array<std::unique_ptr<GpuVoice>,4> voices;
           for(size_t i=0;i<4;++i)voices[i]=std::make_unique<GpuVoice>(*bank[i],i==0?applio:hubert,rmvpe,dev,stream);
           auto source=fixture("rmvpe.input.f32",{1,5120});auto src=source.data_ptr<float>();
           std::array<float,5120> shared{};
           auto append=[&](const float* next){std::move(shared.begin()+160,shared.end(),shared.begin());std::copy_n(next,160,shared.end()-160);};
           std::array<std::vector<double>,4> times;for(auto& v:times)v.reserve(300);
           std::array<int,4> misses{};
           // Cycle all voices through the same input. No model load or graph capture in loop.
           for(int n=0;n<1200;++n){
            int i=(n/300)%4;
            append(src+(n%32)*160);auto t=Clock::now();auto& out=voices[i]->run_window(shared.data());double d=ms(t);
            times[i].push_back(d);misses[i]+=(d>10.);
            require(at::isfinite(out).all().item<bool>(),"GPU waveform nonfinite");
           }
           for(int i=0;i<4;++i){
            auto& ts=times[i];std::sort(ts.begin(),ts.end());
            std::cout<<"CUDA_FIXED_WINDOW "<<bank[i]->preset->name<<" hop_ms=10 p50_ms="<<ts[149]<<" p99_ms="<<ts[296]<<" max_ms="<<ts.back()<<" deadline_misses="<<misses[i]<<" total_audio_latency=NOT_MEASURED"<<std::endl;
           }
           // Random access switches over preloaded models and a shared input history.
           // Treat this as switch compute time, not audio continuity or device latency.
           for(int i=0;i<32;++i){append(src+(i%32)*160);auto t=Clock::now();auto& out=voices[i%4]->run_window(shared.data());require(at::isfinite(out).all().item<bool>(),"switch waveform");std::cout<<"CUDA_SWITCH "<<bank[i%4]->preset->name<<" compute_ms="<<ms(t)<<std::endl;}
          }
          // Integration point for the host's worker thread. The callback uses only
          // AudioBridge; this method must never run on the audio thread.
          struct NativeAudioWorker {
           voicebank::AudioBridge& bridge;
           std::array<std::unique_ptr<GpuVoice>,4>& voices;
           voicebank::SharedHistory history;
           voicebank::TailResampler resampler;
           voicebank::CausalEnvelope envelope;
           voicebank::SwitchJoin join;
           uint64_t next=0;bool started=false;unsigned previous=4;
           NativeAudioWorker(voicebank::AudioBridge& b,std::array<std::unique_ptr<GpuVoice>,4>& v):bridge(b),voices(v){}
           bool step(){
            voicebank::InputFrame input;
            if(!bridge.take(input))return false;
            if(started&&input.first!=next){history.reset();envelope.reset();join.reset();bridge.counts.discontinuities.fetch_add(1,std::memory_order_relaxed);}
            started=true;next=input.first+voicebank::host_hop;
            auto& window=history.append(input);
            if(bridge.published_cursor.load(std::memory_order_acquire)>input.first+voicebank::internal_delay){bridge.counts.worker_failures.fetch_add(1,std::memory_order_relaxed);return true;}
            unsigned id=bridge.selected.load(std::memory_order_acquire);
            if(id>=voices.size()){bridge.counts.worker_failures.fetch_add(1,std::memory_order_relaxed);return true;}
            try{
             at::NoGradGuard guard;
             auto& audio=voices[id]->run_window(window.data());
             voicebank::OutputFrame out{};out.first=input.first;
             require(resampler.run(audio.data_ptr<float>(),audio.numel(),voices[id]->neural.gen.sr,out.samples),"tail resample");
             if(previous!=id)envelope.reset();
             envelope.run(input,out,voices[id]->model.preset->rms);
             join.run(id,out.samples);previous=id;
             for(float v:out.samples)require(std::isfinite(v),"invalid output");
             if(bridge.published_cursor.load(std::memory_order_acquire)>out.first+voicebank::internal_delay)bridge.counts.worker_failures.fetch_add(1,std::memory_order_relaxed);
             else bridge.submit(out);
            }catch(const std::exception& e){
             bridge.counts.worker_failures.fetch_add(1,std::memory_order_relaxed);
             std::cerr<<"AUDIO_WORKER_FAIL "<<e.what()<<std::endl;
            }
            return true;
           }
          };
