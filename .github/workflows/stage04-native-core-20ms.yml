name: Stage 04 native core 20ms gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/stage04-native-core-20ms.yml'
  push:
    branches: [stage01-python-verification]
    paths:
      - '.github/workflows/stage04-native-core-20ms.yml'
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: VoiceBank-Stage03-Frozen
          path: frozen
          github-token: ${{ github.token }}
          run-id: '46134456010'
      - name: Acquire exact original checkpoints and indices
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libopenblas-dev libssl-dev
          curl --fail --location --retry 3 https://raw.githubusercontent.com/pytorch/pytorch/v2.7.1/torch/csrc/jit/serialization/unpickler.cpp -o unpickler.cpp
          python - <<'PATCH'
          from pathlib import Path
          p=Path('unpickler.cpp')
          s=p.read_text()
          marker='} else if (module_name == "collections" && class_name == "OrderedDict") {'
          start=s.index(marker)
          end=s.index('} else if (module_name == "torch" && class_name == "device") {',start)
          old=s[start:end]
          assert 'stack_.back() = IValue();' in old
          # Preserve actual OrderedDict keys and insertion order in the native dict.
          s=s[:start]+old.replace('stack_.back() = IValue();','TORCH_CHECK(stack_.back().isTuple() && stack_.back().toTupleRef().elements().empty(), "unsupported OrderedDict constructor");\n      stack_.back() = c10::impl::GenericDict(c10::AnyType::get(), c10::AnyType::get());')+s[end:]
          # Python state_dict may also include _metadata as object state.
          old='    case PickleOpCode::BUILD:\n    case PickleOpCode::REDUCE: {'
          assert old in s
          s=s.replace(old,'''    case PickleOpCode::BUILD:
      if (stack_.size() >= 2 && stack_[stack_.size()-2].isGenericDict() && stack_.back().isGenericDict()) {
        auto state = stack_.back().toGenericDict();
        TORCH_CHECK(state.size() == 1 && state.contains(IValue("_metadata")), "unsupported dictionary BUILD state");
        stack_.pop_back();
        break;
      }
      [[fallthrough]];
    case PickleOpCode::REDUCE: {''')
          p.write_text(s)
          PATCH
          git clone --depth 1 --branch v1.10.0 https://github.com/facebookresearch/faiss.git faiss-src
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'huggingface_hub>=0.26,<1'
          mkdir -p stage04-native
          python - <<'PY'
          import hashlib, zipfile, pathlib, shutil, json
          from huggingface_hub import hf_hub_download
          frozen=pathlib.Path("frozen/VoiceBank_03_Presets.json")
          config=json.loads(frozen.read_text())
          cases=[
              ("F8","Rokkonrol/RVC_models","dataset","c4bdb3bb7aef5f7d213f79f57decea9e644fd4d5","Russell Archey [Explore With Us (EWU)].zip","88ba827fe6023d102d6d84a7bc26e1e181b40bb47977ccae1c378b320b3c1582","df8f49d094e57b0abe726d8650de5d865546bce4d893ec59841c51ee0777a08b"),
              ("F9","rayzox57/Joyca_High_RVC","model","035dff8fce32b4efda3e9c25e045e73ac5819812","Joyca_High_Voice_v2_600e.zip","4924376afcc16f3a8c109822239fdc5ce73c0e2459bb9fc71e55564aae0e0c99","d0ea3825eeebaef3531a8eb928ab001908ab7147499f818cfac820bd35074d86")
          ]
          for name,repo,kind,rev,filename,archive_hash,pth_hash in cases:
              p=next(x for x in config["presets"].values() if x["shortcut"]==name)
              fingerprint=p["rvc"]["stage02_model_fingerprint"]
              assert p["rvc"]["parameters"]["index_rate"]==0
              path=hf_hub_download(repo,filename,repo_type=kind,revision=rev)
              with open(path,"rb") as f: assert hashlib.file_digest(f,"sha256").hexdigest()==archive_hash
              with zipfile.ZipFile(path) as z:
                  for ext in (".pth",".index"):
                      members=[n for n in z.namelist() if n.endswith(ext) and (ext==".pth" or pathlib.PurePosixPath(n).name.startswith("added_"))]
                      assert len(members)==1
                      target=pathlib.Path(name+ext)
                      with z.open(members[0]) as src,target.open("wb") as dst: shutil.copyfileobj(src,dst)
                      with target.open("rb") as f: assert hashlib.file_digest(f,"sha256").hexdigest()==fingerprint[ext[1:]+"_sha256"]
                      print("ORIGINAL_HASH_PASS",name,ext,flush=True)
              import torch
              ckpt=torch.load(name+'.pth',map_location='cpu',weights_only=True)
              with open(name+'.golden.tsv','w') as manifest:
                  for key,t in ckpt['weight'].items():
                      raw=t.detach().contiguous().reshape(-1).view(torch.uint8).numpy().tobytes()
                      print(key,t.numel(),t.element_size(),hashlib.sha256(raw).hexdigest(),sep='\t',file=manifest)
          shutil.copyfile(frozen,"stage04-native/VoiceBank_03_Presets.json")
          PY
      - name: Build native model bank and index path
        run: |
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.18)
          project(voicebank_native LANGUAGES CXX)
          find_package(Torch REQUIRED)
          find_package(OpenSSL REQUIRED)
          find_package(OpenMP REQUIRED)
          find_package(BLAS REQUIRED)
          find_package(LAPACK REQUIRED)
          set(FAISS_ENABLE_GPU OFF CACHE BOOL "" FORCE)
          set(FAISS_ENABLE_PYTHON OFF CACHE BOOL "" FORCE)
          set(FAISS_ENABLE_C_API OFF CACHE BOOL "" FORCE)
          set(BUILD_TESTING OFF CACHE BOOL "" FORCE)
          add_subdirectory(faiss-src faiss-build EXCLUDE_FROM_ALL)
          add_executable(voicebank_native core.cpp unpickler.cpp)
          target_link_libraries(voicebank_native PRIVATE OpenSSL::Crypto)
          target_link_libraries(voicebank_native PRIVATE "${TORCH_LIBRARIES}" faiss LAPACK::LAPACK BLAS::BLAS OpenMP::OpenMP_CXX)
          set_property(TARGET voicebank_native PROPERTY CXX_STANDARD 17)
          EOF
          cat > core.cpp <<'EOF'
          #include <torch/csrc/jit/serialization/import_read.h>
          #include <caffe2/serialize/inline_container.h>
          #include <ATen/ATen.h>
          #include <torch/csrc/jit/serialization/unpickler.h>
          #include <openssl/sha.h>
          #include <fstream>
          #include <iomanip>
          #include <sstream>
          #include <unordered_map>
          #include <cstring>
          #include <faiss/Index.h>
          #include <faiss/index_io.h>
          #include <array>
          #include <atomic>
          #include <chrono>
          #include <cmath>
          #include <iostream>
          #include <memory>
          #include <stdexcept>
          #include <vector>
          using Clock=std::chrono::steady_clock;
          double ms(Clock::time_point t){return std::chrono::duration<double,std::milli>(Clock::now()-t).count();}
          void require(bool v,const char* msg){if(!v) throw std::runtime_error(msg);}
          struct Preset{const char* name;int pitch;float index,protect,rms;};
          constexpr std::array<Preset,4> presets{{
           {"F6",20,.75f,.5f,1.f},{"F7",15,1.f,.33f,.25f},
           {"F8",-12,0.f,.33f,1.f},{"F9",-16,0.f,.33f,1.f}}};
          constexpr int sample_rate=48000;
          constexpr int target_samples=960;
          static_assert(target_samples*1000/sample_rate==20);
          c10::IValue load_original(caffe2::serialize::PyTorchStreamReader& archive){
           auto record=archive.getRecord("data.pkl");
           auto& ptr=std::get<0>(record);
           auto size=std::get<1>(record);
           size_t pos=0;
           auto input=[&](char* dst,size_t n){n=std::min(n,size-pos);std::memcpy(dst,static_cast<const char*>(ptr.get())+pos,n);pos+=n;return n;};
           auto storage=[&](const std::string& key){return std::get<0>(archive.getRecord("data/"+key));};
           torch::jit::Unpickler u(input,nullptr,nullptr,storage,at::Device(at::kCPU),false,torch::jit::Unpickler::defaultTypeParser,nullptr);
           u.set_version(archive.version());
           return u.parse_ivalue();
          }
          std::string digest_tensor(const at::Tensor& t){
           auto b=t.contiguous();
           unsigned char digest[SHA256_DIGEST_LENGTH];
           SHA256(static_cast<const unsigned char*>(b.data_ptr()),b.nbytes(),digest);
           std::ostringstream out;
           for(auto x:digest)out<<std::hex<<std::setw(2)<<std::setfill('0')<<int(x);
           return out.str();
          }
          struct Model {
           c10::IValue checkpoint;
           std::unique_ptr<faiss::Index> index;
           const Preset* preset;
           std::vector<float> index_vectors;
           Model(const Preset& p):preset(&p){
            auto start=Clock::now();
            caffe2::serialize::PyTorchStreamReader reader(std::string(p.name)+".pth");
            checkpoint=load_original(reader);
            auto root=checkpoint.toGenericDict();
            auto weights=root.at(c10::IValue("weight")).toGenericDict();
            std::ifstream golden(std::string(p.name)+".golden.tsv");
            require(bool(golden),"missing golden manifest");
            std::unordered_map<std::string,std::string> hashes;
            std::string key,h; long long n,b;
            while(golden>>key>>n>>b>>h) hashes.emplace(key,h);
            long count=0; long long elements=0;
            for(auto& kv:weights){
             auto t=kv.value().toTensor();
             require(t.device().is_cpu(),"device mapping");
             require(at::isfinite(t).all().item<bool>(),"nonfinite");
             auto key=kv.key().toStringRef();
             require(hashes.at(key)==digest_tensor(t),"tensor bytes mismatch");
             hashes.erase(key);
             ++count;elements+=t.numel();
            }
            require(count==457 && hashes.empty(),"unexpected tensor count");
            index.reset(faiss::read_index((std::string(p.name)+".index").c_str()));
            require(index && index->d==768 && index->ntotal>=8,"invalid original index");
            if(p.index!=0.f){
             index_vectors.resize(size_t(index->ntotal)*index->d);
             index->reconstruct_n(0,index->ntotal,index_vectors.data());
            }
            std::cout<<"MODEL "<<p.name<<" exact_tensor_hashes="<<count<<" tensors="<<count<<" elements="<<elements<<" index_count="<<index->ntotal<<" preload_ms="<<ms(start)<<std::endl;
           }
           // Original RVC k=8, inverse squared distance blend; no active index lookup at rate zero.
           std::vector<float> mix(const std::vector<float>& x,float rate,float protect,bool voiced)const{
            if(rate==0.f) return x;
            require(x.size()==size_t(index->d),"feature dimension");
            std::array<float,8> d{};std::array<faiss::idx_t,8> ids{};
            index->search(1,x.data(),8,d.data(),ids.data());
            double total=0;std::array<double,8> w{};
            for(int i=0;i<8;++i){require(ids[i]>=0 && std::isfinite(d[i]) && d[i]>0,"invalid or exact-zero distance");w[i]=1.0/(double(d[i])*d[i]);total+=w[i];}
            require(!index_vectors.empty(),"index vectors not preloaded");
            std::vector<float> out(x.size(),0);
            for(int i=0;i<8;++i){require(ids[i]<index->ntotal,"index ID out of range");for(size_t j=0;j<x.size();++j)out[j]+=float(w[i]/total)*index_vectors[size_t(ids[i])*x.size()+j];}
            const float a=voiced?1.f:protect;
            for(size_t j=0;j<x.size();++j)out[j]=(out[j]*rate+x[j]*(1-rate))*a+x[j]*(1-a);
            return out;
           }
          };
          int main(){
           try{
            // Load both public original checkpoints once; no reloading on selection.
            Model f8(presets[2]),f9(presets[3]);
            std::atomic<const Model*> selected{&f8};
            require(selected.is_lock_free(),"pointer atomics not lock free");
            double worst=0;
            for(int i=0;i<10000;++i){auto t=Clock::now();selected.store(i%2?&f8:&f9,std::memory_order_release);auto p=selected.load(std::memory_order_acquire);require(p!=nullptr,"selection");worst=std::max(worst,ms(t));}
            std::cout<<"SELECTION_ONLY max_ms="<<worst<<" not_audio_latency=1"<<std::endl;
            for(auto* m:{&f8,&f9}){
             std::vector<float> q(768,0.013f);
             require(m->mix(q,0,m->preset->protect,true)==q,"index bypass failed");
             // Nonzero-index algorithm is NOT adopted for F8/F9. Actual F6/F7 indexes not available to this public runner.
             std::cout<<"INDEX_BYPASS "<<m->preset->name<<" pass"<<std::endl;
            }
            std::cout<<"NATIVE_CORE_PASS preload_and_selection_only; neural_inference=not_implemented; audio_latency=not_measured"<<std::endl;
            return 0;
           }catch(const std::exception& e){std::cerr<<"NATIVE_CORE_FAIL "<<e.what()<<std::endl;return 1;}
          }
          EOF
          cp CMakeLists.txt core.cpp unpickler.cpp stage04-native/
          cmake -S . -B build -DCMAKE_PREFIX_PATH="$(python -c 'import torch;print(torch.utils.cmake_prefix_path)')" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target voicebank_native -j2
      - name: Run native code with no Python interpreter
        run: |
          set -o pipefail
          env -u PYTHONPATH ./build/voicebank_native | tee stage04-native/native.log
          ldd build/voicebank_native > stage04-native/dependencies.txt
          if grep -q libpython stage04-native/dependencies.txt; then exit 1; fi
      - name: Establish strict 20ms acceptance gate
        if: always()
        run: |
          mkdir -p stage04-native
          cat > stage04-native/acceptance.json <<'EOF'
          {
            "total_latency_limit_ms":20,
            "measurement_scope":"microphone input to audible output including host, queue, GPU and device buffering",
            "sample_rate_hz":48000,
            "max_total_latency_samples_at_48k":960,
            "processing_hop_candidates_ms":[5,10],
            "note":"Official RVC feature/pitch geometry must be preserved or independently validated; 5ms is host callback candidate, not proven neural hop.",
            "original_files_only":true,
            "model_conversion":false,
            "python_resident":false,
            "acceptance":{"all_four_presets":true,"no_underruns":true,"no_dropped_blocks":true,"max_measured_total_latency_ms":20,"audio_quality_reference_check":true},
            "native_scope":"F8/F9 model preloading, original index read, atomic pointer selection and bypass only",
            "gpu_measured":false,
            "audio_latency_measured":false,
            "overall":"NOT_PASSED"
          }
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VoiceBank-Stage04-Native-Core-20ms
          path: stage04-native/
          retention-days: 30
