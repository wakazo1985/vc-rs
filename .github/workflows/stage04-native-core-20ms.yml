          // Native RMVPE: original E2E state_dict, Slaney-normalized HTK mel, U-Net, bidirectional GRU.
          struct NativeRMVPE {
           std::unordered_map<std::string,at::Tensor> w;
           at::Tensor basis,window;
           explicit NativeRMVPE(const std::string& path){
            caffe2::serialize::PyTorchStreamReader reader(path);
            auto root=load_original(reader).toGenericDict();
            for(auto& kv:root)if(kv.value().isTensor())w.emplace(kv.key().toStringRef(),kv.value().toTensor().to(at::kFloat));
            require(w.count("fc.0.gru.weight_ih_l0")&&w.count("unet.encoder.bn.weight"),"RMVPE state dictionary");
            auto opts=at::TensorOptions().dtype(at::kFloat);
            basis=at::empty({128,513},opts);auto ptr=basis.data_ptr<float>();
            std::array<double,130> hz{};
            const double m0=2595*std::log10(1+30.0/700),m1=2595*std::log10(1+8000.0/700);
            for(int i=0;i<130;++i)hz[i]=700*(std::pow(10,(m0+(m1-m0)*i/129)/2595)-1);
            for(int i=0;i<128;++i)for(int j=0;j<513;++j){
             double f=j*16000.0/1024;
             double lo=(f-hz[i])/(hz[i+1]-hz[i]),hi=(hz[i+2]-f)/(hz[i+2]-hz[i+1]);
             ptr[i*513+j]=float(std::max(0.0,std::min(lo,hi))*2/(hz[i+2]-hz[i]));
            }
            window=at::hann_window(1024,true,opts);
           }
           const at::Tensor& W(const std::string& k)const{return w.at(k);}
           at::Tensor conv(const at::Tensor& x,const std::string& k,int64_t pad=1)const{
            std::optional<at::Tensor> b;if(w.count(k+".bias"))b=W(k+".bias");
            return at::conv2d(x,W(k+".weight"),b,at::IntArrayRef{1,1},at::IntArrayRef{pad,pad},at::IntArrayRef{1,1},1);
           }
           at::Tensor bn(const at::Tensor& x,const std::string& k)const{
            return at::batch_norm(x,W(k+".weight"),W(k+".bias"),W(k+".running_mean"),W(k+".running_var"),false,0.01,1e-5,true);
           }
           at::Tensor block(const at::Tensor& x,const std::string& k)const{
            auto h=at::relu(bn(conv(x,k+".conv.0"),k+".conv.1"));
            h=at::relu(bn(conv(h,k+".conv.3"),k+".conv.4"));
            return h+(w.count(k+".shortcut.weight")?conv(x,k+".shortcut",0):x);
           }
           at::Tensor blocks(at::Tensor x,const std::string& k)const{
            for(int i=0;i<4;++i)x=block(x,k+"."+std::to_string(i));return x;
           }
           at::Tensor mel(const at::Tensor& input)const{
            auto framed=at::reflection_pad1d(input.unsqueeze(1),{512,512}).squeeze(1).unfold(-1,1024,160)*window;
            auto fft=at::fft_rfft(framed,1024,-1,std::nullopt);
            auto mag=at::abs(fft).transpose(1,2);
            return at::log(at::matmul(basis,mag).clamp_min(1e-5));
           }
           at::Tensor hidden(const at::Tensor& m)const{
            auto t=m.size(2);auto n=(32-t%32)%32;
            auto x=at::constant_pad_nd(m,{0,n},0).transpose(1,2).unsqueeze(1);
            x=bn(x,"unet.encoder.bn");std::vector<at::Tensor> skip;
            for(int i=0;i<5;++i){x=blocks(x,"unet.encoder.layers."+std::to_string(i)+".conv");skip.push_back(x);x=at::avg_pool2d(x,{2,2},{2,2},{0,0},false,true,std::nullopt);}
            for(int i=0;i<4;++i)x=blocks(x,"unet.intermediate.layers."+std::to_string(i)+".conv");
            for(int i=0;i<5;++i){
             auto k="unet.decoder.layers."+std::to_string(i);
             x=at::conv_transpose2d(x,W(k+".conv1.0.weight"),std::nullopt,{2,2},{1,1},{1,1},1,{1,1});
             x=at::relu(bn(x,k+".conv1.1"));
             x=blocks(at::cat({x,skip[4-i]},1),k+".conv2");
            }
            x=conv(x,"cnn").transpose(1,2).flatten(2);
            std::vector<at::Tensor> p;
            for(auto suffix:{"","_reverse"})for(auto key:{"weight_ih_l0","weight_hh_l0","bias_ih_l0","bias_hh_l0"})p.push_back(W(std::string("fc.0.gru.")+key+suffix));
            auto hx=at::zeros({2,x.size(0),256},x.options());
            x=std::get<0>(at::gru(x,hx,p,true,1,0.0,false,true,true));
            return at::sigmoid(at::linear(x,W("fc.1.weight"),W("fc.1.bias"))).slice(1,0,t).contiguous();
           }
           at::Tensor decode(const at::Tensor& h)const{
            auto sal=h.squeeze(0);auto centers=sal.argmax(1,true);
            auto offsets=at::arange(9,centers.options()).reshape({1,9});
            auto ids=centers+offsets;
            auto probs=at::constant_pad_nd(sal,{4,4},0).gather(1,ids);
            auto cents=at::constant_pad_nd(at::arange(360,sal.options().dtype(at::kDouble))*20+1997.3794084376191,{4,4},0);
            auto values=cents.index_select(0,ids.reshape({-1})).reshape(ids.sizes());
            auto avg=(probs.to(at::kDouble)*values).sum(1)/probs.sum(1).to(at::kDouble);
            auto f=10*at::pow(2,avg/1200);
            return at::where(std::get<0>(sal.max(1)).le(0.03),at::zeros_like(f),f).to(at::kFloat);
           }
          };
          at::Tensor fixture(const std::string& path,at::IntArrayRef sizes){
           auto x=at::empty(sizes,at::TensorOptions().dtype(at::kFloat));
           std::ifstream in(path,std::ios::binary);in.read(static_cast<char*>(x.data_ptr()),x.nbytes());
           require(in.gcount()==static_cast<std::streamsize>(x.nbytes()),"missing RMVPE fixture");
           return x;
          }
