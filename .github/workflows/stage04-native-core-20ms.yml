          }
          // RVC reverse residual coupling: weight-normalized WN, flip, mean-only coupling.
          struct ReverseFlow {
           std::unordered_map<std::string,at::Tensor> w;
           int64_t hidden,inter;
           explicit ReverseFlow(const c10::impl::GenericDict& root){
            auto config=root.at(c10::IValue("config"));auto cfg=config.toListRef();
            inter=cfg[2].toInt();hidden=cfg[3].toInt();
            auto weights=root.at(c10::IValue("weight")).toGenericDict();
            for(auto& kv:weights){
             auto k=kv.key().toStringRef();
             if(k.rfind("flow.",0)==0||k=="emb_g.weight")w.emplace(k,kv.value().toTensor().to(at::kFloat));
            }
            std::vector<std::string> keys;
            for(auto& kv:w)if(kv.first.size()>9&&kv.first.substr(kv.first.size()-9)==".weight_v")keys.push_back(kv.first);
            for(auto& k:keys){
             auto base=k.substr(0,k.size()-9);
             auto v=w.at(k);
             w.emplace(base+".weight",at::_weight_norm(v,w.at(base+".weight_g"),0));
            }
           }
           at::Tensor conv(const at::Tensor& x,const std::string& k)const{
            auto a=w.at(k+".weight");int64_t padding=(a.size(2)-1)/2;
            return at::conv1d(x,a,w.at(k+".bias"),at::IntArrayRef{1},at::IntArrayRef{padding},at::IntArrayRef{1},1);
           }
           at::Tensor forward(at::Tensor x,const at::Tensor& mask,int64_t sid)const{
            auto g=w.at("emb_g.weight").select(0,sid).reshape({1,-1,1});
            for(int f=6;f>=0;f-=2){
             x=at::flip(x,{1});
             auto k="flow.flows."+std::to_string(f);
             auto x0=x.slice(1,0,inter/2),x1=x.slice(1,inter/2,inter);
             auto h=conv(x0,k+".pre")*mask;
             auto cond=conv(g,k+".enc.cond_layer"),out=at::zeros_like(h);
             for(int i=0;i<3;++i){
              auto s=std::to_string(i);
              auto a=conv(h,k+".enc.in_layers."+s)+cond.slice(1,i*2*hidden,(i+1)*2*hidden);
              auto acts=at::tanh(a.slice(1,0,hidden))*at::sigmoid(a.slice(1,hidden,2*hidden));
              auto res=conv(acts,k+".enc.res_skip_layers."+s);
              if(i<2){h=(h+res.slice(1,0,hidden))*mask;out=out+res.slice(1,hidden,2*hidden);}
              else out=out+res;
             }
             auto m=conv(out*mask,k+".post")*mask;
             x=at::cat({x0,(x1-m)*mask},1);
            }
            return x.contiguous();
           }
          };
          void verify_flow(const c10::impl::GenericDict& root,const std::string& name){
           at::NoGradGuard guard;ReverseFlow flow(root);
           for(int64_t t:{8,33}){
            auto z=(at::arange(t*flow.inter,at::TensorOptions().dtype(at::kFloat)).remainder(67)-33).reshape({1,flow.inter,t})/67;
            auto mask=at::arange(t,at::TensorOptions().dtype(at::kLong)).lt(t-2).reshape({1,1,t}).to(at::kFloat);
            auto start=Clock::now();auto out=flow.forward(z,mask,0);auto elapsed=ms(start);
            auto ref=at::empty_like(out);std::ifstream in(name+".flow"+std::to_string(t)+".f32",std::ios::binary);
            in.read(static_cast<char*>(ref.data_ptr()),ref.nbytes());require(in.gcount()==static_cast<std::streamsize>(ref.nbytes()),"missing flow reference");
            std::cout<<"REVERSE_FLOW "<<name<<" frames="<<t<<" max_abs_error="<<(out-ref).abs().max().item<float>()<<" cpu_ms="<<elapsed<<std::endl;
            require(at::allclose(out,ref,1e-4,1e-4),"official reverse flow mismatch");
           }
          }
          // RVC neural source-filter decoder; deterministic injected excitation noise for parity tests.
          struct Generator {
           std::unordered_map<std::string,at::Tensor> w;
           std::vector<int64_t> rates,kernels;
           std::vector<std::vector<int64_t>> dilations;
           int64_t sr,upp=1;bool block1;
           explicit Generator(const c10::impl::GenericDict& root){
            auto config=root.at(c10::IValue("config"));auto cfg=config.toListRef();
            block1=cfg[9].toStringRef()=="1";
            auto ds=cfg[11].toListRef();
            for(auto& d:ds){std::vector<int64_t> a;for(auto& v:d.toListRef())a.push_back(v.toInt());dilations.push_back(a);}
            for(auto& v:cfg[12].toListRef()){rates.push_back(v.toInt());upp*=v.toInt();}
            for(auto& v:cfg[14].toListRef())kernels.push_back(v.toInt());
            sr=cfg[17].isInt()?cfg[17].toInt():std::stoll(cfg[17].toStringRef())*1000;
            auto weights=root.at(c10::IValue("weight")).toGenericDict();
            for(auto& kv:weights){auto k=kv.key().toStringRef();if(k.rfind("dec.",0)==0||k=="emb_g.weight")w.emplace(k,kv.value().toTensor().to(at::kFloat));}
            std::vector<std::string> keys;
            for(auto& kv:w)if(kv.first.size()>9&&kv.first.substr(kv.first.size()-9)==".weight_v")keys.push_back(kv.first);
            for(auto& k:keys){auto base=k.substr(0,k.size()-9);w.emplace(base+".weight",at::_weight_norm(w.at(k),w.at(base+".weight_g"),0));}
           }
           at::Tensor conv(const at::Tensor& x,const std::string& k,int64_t stride=1,int64_t pad=-1,int64_t dil=1)const{
            auto a=w.at(k+".weight");if(pad<0)pad=(a.size(2)-1)*dil/2;
            std::optional<at::Tensor> bias;if(w.count(k+".bias"))bias=w.at(k+".bias");
            return at::conv1d(x,a,bias,at::IntArrayRef{stride},at::IntArrayRef{pad},at::IntArrayRef{dil},1);
           }
           at::Tensor source(const at::Tensor& f0,const at::Tensor& noise)const{
            auto f=f0.unsqueeze(-1);
            auto rad=f/double(sr)*at::arange(1,upp+1,f.options());
            auto last=at::fmod(rad.slice(-1,upp-1,upp).to(at::kFloat)+0.5,1.0)-0.5;
            auto acc=at::fmod(last.cumsum(1),1.0).to(f.scalar_type());
            rad=rad+at::constant_pad_nd(acc,{0,0,1,-1},0);
            auto sine=at::sin(rad.reshape({f.size(0),-1,1})*(2.0*3.14159265358979323846))*0.1;
            auto uv=f.gt(0).to(f.scalar_type()).repeat_interleave(upp,1);
            auto waves=sine*uv+(uv*0.003+(1-uv)*0.1/3.0)*noise;
            return at::tanh(at::linear(waves,w.at("dec.m_source.l_linear.weight"),w.at("dec.m_source.l_linear.bias"))).transpose(1,2);
           }
           at::Tensor residual(at::Tensor x,const std::string& k,const std::vector<int64_t>& ds)const{
            for(size_t i=0;i<ds.size();++i){auto n=std::to_string(i);
             auto y=conv(at::leaky_relu(x,0.1),k+(block1?".convs1.":".convs.")+n,1,-1,ds[i]);
             if(block1)y=conv(at::leaky_relu(y,0.1),k+".convs2."+n);
             x=x+y;
            }return x;
           }
           at::Tensor forward(at::Tensor x,const at::Tensor& f0,const at::Tensor& noise,int64_t sid)const{
            auto har=source(f0,noise);auto g=w.at("emb_g.weight").select(0,sid).reshape({1,-1,1});
            x=conv(x,"dec.conv_pre");if(w.count("dec.cond.weight"))x=x+conv(g,"dec.cond");
            int64_t rest=upp;
            for(size_t i=0;i<rates.size();++i){auto k="dec.ups."+std::to_string(i);auto u=rates[i];rest/=u;
             x=at::conv_transpose1d(at::leaky_relu(x,0.1),w.at(k+".weight"),w.at(k+".bias"),{u},{(kernels[i]-u)/2},{0},1,{1});
             x=x+conv(har,"dec.noise_convs."+std::to_string(i),rest,rest==1?0:rest/2);
             at::Tensor sum;
             for(size_t j=0;j<dilations.size();++j){auto y=residual(x,"dec.resblocks."+std::to_string(i*dilations.size()+j),dilations[j]);sum=sum.defined()?sum+y:y;}
             x=sum/double(dilations.size());
            }
            return at::tanh(conv(at::leaky_relu(x,0.01),"dec.conv_post")).contiguous();
           }
          };
