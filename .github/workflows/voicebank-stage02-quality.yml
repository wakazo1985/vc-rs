name: VoiceBank 02 audio pipeline tests
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/voicebank-stage02-quality.yml'
      - 'crates/vc-core/src/model_rvc/pipeline.rs'
permissions:
  contents: read
env:
  VC_RS_ENABLE_NATIVE_TENSORRT: "0"
  CARGO_TERM_COLOR: never
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Test DSP, retrieval, pitch, converted ONNX metadata and streaming
        shell: pwsh
        run: |
          cargo test -p vc-core --no-default-features --features tensorrt --locked --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test existing VST3 functions
        shell: pwsh
        run: |
          cargo test -p vc-vst3 --no-default-features --features tensorrt --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
