name: VoiceBank 02 Protect and 50ms audio tests
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/voicebank-stage02-quality.yml'
permissions:
  contents: read
env:
  VC_RS_ENABLE_NATIVE_TENSORRT: "0"
  CARGO_TERM_COLOR: never
jobs:
  vst3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test VST3 including real smoothing with mock inference
        run: cargo test -p vc-vst3 --no-default-features --features tensorrt --locked -- --nocapture
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test RVC core Protect and crossfade
        run: cargo test -p vc-core --no-default-features --features tensorrt --locked --lib -- --nocapture
