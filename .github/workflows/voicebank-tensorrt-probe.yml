name: VoiceBank native TensorRT build and GPU probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/voicebank-tensorrt-probe.yml'
      - 'crates/vc-core/src/**'
      - 'crates/vc-vst3/**'
      - 'crates/vc-cli/**'
      - 'crates/vc-convert/**'
      - 'Cargo.lock'
      - 'scripts/voicebank-benchmark.ps1'
      - 'docs/voicebank-final-ja.md'
permissions:
  contents: read
env:
  VC_RS_ENABLE_NATIVE_TENSORRT: "1"
  CARGO_TERM_COLOR: never
jobs:
  native-probe:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Extract verified official CUDA component archives
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='https://developer.download.nvidia.com/compute/cuda/redist'
          $manifest=Invoke-RestMethod "$base/redistrib_13.3.1.json"
          $root=Join-Path $env:RUNNER_TEMP 'CUDA/v13.3'
          New-Item -ItemType Directory -Force $root | Out-Null
          foreach ($component in @('cuda_cudart','cuda_crt','cuda_nvcc','cccl')) {
            $entry=$manifest.$component.'windows-x86_64'
            if (!$entry.relative_path -or !$entry.sha256) { throw "Missing official manifest entry: $component" }
            $archive=Join-Path $env:RUNNER_TEMP "$component.zip"
            curl.exe --fail --location --retry 2 --silent --show-error --output $archive "$base/$($entry.relative_path)"
            if ($LASTEXITCODE -ne 0) { throw "Download failed: $component" }
            if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $entry.sha256) { throw "SHA256 mismatch: $component" }
            $out=Join-Path $env:RUNNER_TEMP "extract-$component"
            7z x $archive "-o$out" -y
            if ($LASTEXITCODE -ne 0) { throw "Extraction failed: $component" }
            $dir=Get-ChildItem $out -Directory | Select-Object -First 1
            if (!$dir) { throw "Missing archive directory: $component" }
            foreach ($sub in @('include','lib','bin','nvvm')) {
              $from=Join-Path $dir.FullName $sub
              if (Test-Path $from) {
                $dest=Join-Path $root $sub
                New-Item -ItemType Directory -Force $dest | Out-Null
                Copy-Item "$from/*" $dest -Recurse -Force
              }
            }
            Get-ChildItem $dir.FullName -File | Where-Object Name -Match 'LICENSE|EULA' | ForEach-Object { Copy-Item $_.FullName (Join-Path $root "$component-$($_.Name)") -Force }
            Write-Host "CUDA_COMPONENT_OK $component $($manifest.$component.version)"
          }
          if (!(Test-Path "$root/lib/x64/cudart.lib") -and (Test-Path "$root/lib/cudart.lib")) {
            New-Item -ItemType Directory -Force "$root/lib/x64" | Out-Null
            Copy-Item "$root/lib/cudart.lib" "$root/lib/x64/"
          }
          foreach ($file in @('include/cuda_runtime_api.h','include/crt/host_defines.h','lib/x64/cudart.lib')) {
            if (!(Test-Path (Join-Path $root $file))) { throw "CUDA component missing: $file" }
            Write-Host "SDK_FILE_OK $file"
          }
          "CUDA_PATH=$root" >> $env:GITHUB_ENV
          "CUDA_HOME=$root" >> $env:GITHUB_ENV
      - name: Acquire official NVIDIA SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://developer.nvidia.com/downloads/compute/machine-learning/tensorrt/11.2.1/zip/TensorRT-Enterprise-11.2.1.2-Windows-amd64-cuda-13.3-Release-external.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'tensorrt.zip'
          curl.exe --fail --location --retry 2 --output $zip $url
          if ($LASTEXITCODE -ne 0) { throw 'Official TensorRT SDK download failed; NVIDIA authentication may be required.' }
          New-Item -ItemType Directory -Force external/nvidia | Out-Null
          7z x $zip "-o$PWD\external\nvidia" -y
          if ($LASTEXITCODE -ne 0) { throw 'TensorRT SDK archive extraction failed.' }
          . scripts/tensorrt-sdk.ps1
          $sdk = Resolve-TensorRtSdk -RepoRoot $PWD.Path
          if (-not $sdk) { throw 'TensorRT SDK headers, import libraries or runtime DLLs missing.' }
          "TENSORRT_ROOT=$($sdk.Root)" >> $env:GITHUB_ENV
      - name: Build native core and RVC smoke tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          . scripts/activate.ps1
          cargo test -p vc-core --no-default-features --features tensorrt --locked --lib --no-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $list = cargo test -p vc-core --no-default-features --features tensorrt --locked --lib -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $list | Write-Host
          if (!($list -match 'native_tensorrt_legacy_streaming_smoke')) { throw 'Native TensorRT was not compiled; refusing stub build' }
          Write-Host 'NATIVE_TENSORRT_COMPILED'
      - name: Compile engine builder
        shell: pwsh
        run: |
          . scripts/activate.ps1
          cargo build --release --manifest-path tools/tensorrt_builder/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test RVC inference on available NVIDIA GPU
        shell: pwsh
        run: |
          . scripts/activate.ps1
          $smi=Get-Command nvidia-smi -ErrorAction SilentlyContinue
          $gpu=$null
          if ($smi) { $gpu=& $smi.Source --query-gpu=name,compute_cap --format=csv,noheader }
          if (!$smi -or $LASTEXITCODE -ne 0 -or !$gpu) {
            'GPU_INFERENCE_NOT_TESTED: no NVIDIA GPU in this runner' | Tee-Object -FilePath gpu-result.txt
            Add-Content $env:GITHUB_STEP_SUMMARY 'GPU inference NOT TESTED: no NVIDIA GPU. Compile success is not runtime validation.'
            return
          }
          $gpu | Write-Host
          $env:VC_RS_TENSORRT_BUILDER_HELPER=(Resolve-Path 'tools/tensorrt_builder/target/release/vc-tensorrt-builder.exe').Path
          cargo test -p vc-core --no-default-features --features tensorrt --locked --lib native_tensorrt_legacy_streaming_smoke -- --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p vc-core --no-default-features --features tensorrt --locked --lib applio_native_tensorrt_streaming -- --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'GPU_INFERENCE_TESTS_PASSED' | Tee-Object -FilePath gpu-result.txt
          Add-Content $env:GITHUB_STEP_SUMMARY 'Native RVC GPU smoke tests passed.'
      - name: Integrated native-build tests (model-free)
        shell: pwsh
        run: |
          . scripts/activate.ps1
          cargo test -p vc-vst3 --no-default-features --features tensorrt --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p vc-cli --no-default-features --features tensorrt --locked --bin vc-rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test saved provider migration
        shell: pwsh
        run: |
          . scripts/activate.ps1
          cargo test -p vc-vst3 --no-default-features --features tensorrt --locked old_windowsml_profile_uses_native_tensorrt -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build integrated VST3 using native TensorRT
        shell: pwsh
        run: |
          . scripts/activate.ps1
          cargo xtask bundle vc-vst3 --release --no-default-features --features tensorrt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'target/bundled/vc-vst3.vst3/Contents/x86_64-win/vc-vst3.vst3')) { throw 'VST3 binary missing' }
          Write-Host 'VST3_NATIVE_BUILD_OK'
      - name: Package TensorRT runtime and engine builder with existing VoiceBank features
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          . scripts/activate.ps1
          $helper=(Resolve-Path 'tools/tensorrt_builder/target/release/vc-tensorrt-builder.exe').Path
          pwsh -File crates/vc-vst3/package-tensorrt.ps1 -BuilderExe $helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build -p vc-convert --example voicebank_convert --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stage='release/RVCVoiceBank-TensorRT'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/bundled/vc-vst3.vst3 $stage/ -Recurse
          $bundle=Join-Path $stage 'vc-vst3.vst3'
          $bin=Join-Path $bundle 'Contents/x86_64-win'
          foreach ($dll in @('nvinfer_11.dll','nvinfer_plugin_11.dll','nvonnxparser_11.dll','cudart64_13.dll','vc-tensorrt-builder.exe','vc-vst3.vst3')) {
            if (!(Test-Path (Join-Path $bin $dll))) { throw "Missing runtime file $dll" }
          }
          if (!(Get-ChildItem $bin -Filter 'nvinfer_builder_resource_*_11.dll')) { throw 'Missing engine builder resources' }
          if (Get-ChildItem $bin -Filter '*WindowsAppRuntime*') { throw 'Unexpected Windows App SDK dependency' }
          foreach ($slot in @('toddler','girl','male','robot','common')) {
            $folder=Join-Path $bundle "models/$slot"
            New-Item -ItemType Directory -Force $folder | Out-Null
            'Keep your existing ONNX/PTH/INDEX files here.' | Set-Content "$folder/README.txt"
          }
          $tools=Join-Path $bundle 'tools'
          New-Item -ItemType Directory -Force $tools | Out-Null
          Copy-Item target/release/examples/voicebank_convert.exe $tools/
          cargo build -p vc-cli --no-default-features --features tensorrt --release --locked --bin vc-rs --example voicebank_wav_metrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/release/vc-rs.exe $bin/
          Copy-Item target/release/examples/voicebank_wav_metrics.exe $bin/
          Copy-Item scripts/voicebank-benchmark.ps1 $tools/
          Copy-Item crates/vc-convert/LICENSE-*.txt $tools/
          Copy-Item crates/vc-convert/THIRD_PARTY.md $tools/
          Copy-Item crates/vc-vst3/src/control.html $stage/
          Copy-Item LICENSE $stage/
          Get-Content -LiteralPath docs/voicebank-final-ja.md -Raw -Encoding UTF8 | Set-Content -LiteralPath "$stage/使い方.txt" -Encoding utf8BOM
          Copy-Item gpu-result.txt "$stage/GPU検証結果.txt"
          # Retain the RTX 5070 Ti SM120 and PTX resources, not unrelated architectures.
          foreach ($f in @('nvinfer_builder_resource_sm120_11.dll','nvinfer_builder_resource_ptx_11.dll')) {
            if (!(Test-Path (Join-Path $bin $f))) { throw "Missing required builder resource $f" }
          }
          Get-ChildItem $bin -Filter 'nvinfer_builder_resource_sm*_11.dll' | Where-Object Name -ne 'nvinfer_builder_resource_sm120_11.dll' | Remove-Item
          foreach ($f in @('vc-rs.exe','voicebank_wav_metrics.exe','vc-vst3.vst3')) {
            if (!(Test-Path (Join-Path $bin $f))) { throw "Missing $f" }
          }
          if ((Get-ChildItem $stage -Recurse -Filter control.html).Count -ne 1) { throw 'Expected exactly one external HTML file' }
          if (!(Test-Path "$tools/voicebank-benchmark.ps1")) { throw 'Missing benchmark' }
          if ((Get-ChildItem $bundle/models -Recurse -File | Where-Object Extension -In @('.onnx','.pth','.index')).Count -gt 0) { throw 'Unexpected trained model in package' }
          "${{ github.sha }}" | Set-Content "$stage/BUILD-COMMIT.txt" -Encoding ascii
          Get-ChildItem $bin -File | Select-Object Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: RVCVoiceBank-TensorRT
          path: release/RVCVoiceBank-TensorRT/
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TensorRT-probe-result
          path: gpu-result.txt
          if-no-files-found: ignore

  host-check:
    needs: native-probe
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RVCVoiceBank-TensorRT
          path: release-test
      - name: Verify exact build
        shell: pwsh
        run: |
          if ((Get-Content release-test/BUILD-COMMIT.txt -Raw).Trim() -ne "${{ github.sha }}") { throw 'Wrong build commit' }
          New-Item -ItemType Directory -Force host-logs | Out-Null
      - name: Check Windows loader and VST3 exports without GPU
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $bundle=(Resolve-Path 'release-test/vc-vst3.vst3').Path
          $dll=Join-Path $bundle 'Contents/x86_64-win/vc-vst3.vst3'
          $source=@'
          using System;
          using System.Runtime.InteropServices;
          public static class VstLoad {
            [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
            public static extern IntPtr LoadLibraryEx(string path, IntPtr reserved, uint flags);
            [DllImport("kernel32.dll", CharSet=CharSet.Ansi, SetLastError=true)]
            public static extern IntPtr GetProcAddress(IntPtr module, string name);
          }
          '@
          Add-Type -TypeDefinition $source
          $h=[VstLoad]::LoadLibraryEx($dll,[IntPtr]::Zero,0x1100)
          $err=[Runtime.InteropServices.Marshal]::GetLastWin32Error()
          "MODULE_LOAD handle=$h win32=$err" | Tee-Object host-logs/loader.txt
          if ($h -eq [IntPtr]::Zero) { throw "VST3 LoadLibraryEx failed: $err" }
          foreach ($name in @('GetPluginFactory','InitDll','ExitDll')) {
            $p=[VstLoad]::GetProcAddress($h,$name)
            "EXPORT $name address=$p" | Tee-Object host-logs/loader.txt -Append
            if ($p -eq [IntPtr]::Zero) { throw "Missing export: $name" }
          }
          $probe=Join-Path $bundle 'write-test.tmp'
          [IO.File]::WriteAllText($probe,'test')
          Remove-Item $probe
          'BUNDLE_WRITE_OK' | Tee-Object host-logs/loader.txt -Append
      - name: Build official Steinberg validator
        shell: pwsh
        run: |
          pwsh -File scripts/install-vst3-validator.ps1 *> host-logs/validator-build.log
          $code=$LASTEXITCODE
          Get-Content host-logs/validator-build.log -Tail 40
          if ($code -ne 0) { exit $code }
      - name: Run actual host initialization
        shell: pwsh
        run: |
          $v=Get-ChildItem external/steinberg/vst3sdk-build -Recurse -Filter validator.exe | Select-Object -First 1
          if (!$v) { throw 'Validator missing' }
          $bundle=(Resolve-Path 'release-test/vc-vst3.vst3').Path
          & $v.FullName $bundle *> host-logs/validator.log
          $code=$LASTEXITCODE
          Get-Content host-logs/validator.log -Tail 100
          if (Test-Path "$bundle/logs") { Copy-Item "$bundle/logs" host-logs/plugin-logs -Recurse; Get-ChildItem "$bundle/logs" -File | Select-String 'INITIALIZE|HTTP_START|HTTP_ERROR|HTTP_STOP' | Select-Object -First 30 }
          if ($code -ne 0) { exit $code }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage07-host-check
          path: host-logs/
  publish:
    needs: [native-probe, host-check]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RVCVoiceBank-TensorRT
          path: package
      - name: Verify ZIP and publish exact build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < package/BUILD-COMMIT.txt)" = "$GITHUB_SHA"
          bin=package/vc-vst3.vst3/Contents/x86_64-win
          for f in nvinfer_11.dll nvinfer_plugin_11.dll nvonnxparser_11.dll cudart64_13.dll vc-tensorrt-builder.exe vc-vst3.vst3 vc-rs.exe voicebank_wav_metrics.exe nvinfer_builder_resource_sm120_11.dll nvinfer_builder_resource_ptx_11.dll; do test -s "$bin/$f"; done
          test -s package/control.html
          test -s package/使い方.txt
          test -s package/vc-vst3.vst3/tools/voicebank_convert.exe
          test -s package/vc-vst3.vst3/tools/voicebank-benchmark.ps1
          (cd package && zip -1 -q -r ../RVCVoiceBank-TensorRT-RTX5070Ti.zip .)
          unzip -tq RVCVoiceBank-TensorRT-RTX5070Ti.zip
          test "$(stat -c %s RVCVoiceBank-TensorRT-RTX5070Ti.zip)" -lt 2147483648
          sha256sum RVCVoiceBank-TensorRT-RTX5070Ti.zip > RVCVoiceBank-TensorRT-RTX5070Ti.zip.sha256
          tag="voicebank-stage07-${GITHUB_SHA:0:12}"
          notes="Windows native TensorRT build, host validator and package checks passed. Actual RTX 5070 Ti audio quality and Wave Link behavior not verified. No trained models included."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" RVCVoiceBank-TensorRT-RTX5070Ti.zip RVCVoiceBank-TensorRT-RTX5070Ti.zip.sha256 --clobber
          else
            gh release create "$tag" RVCVoiceBank-TensorRT-RTX5070Ti.zip RVCVoiceBank-TensorRT-RTX5070Ti.zip.sha256 --target "$GITHUB_SHA" --prerelease --title "RVC VoiceBank Stage 07 RTX 5070 Ti" --notes "$notes"
          fi
          gh release view "$tag" --json assets,url

# Stage 07: rebuild after the verified formatting corrections.
