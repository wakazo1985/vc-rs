name: VoiceBank 03 per-voice tuning tests
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/voicebank-stage03-quality.yml'
permissions:
  contents: read
env:
  VC_RS_ENABLE_NATIVE_TENSORRT: "0"
  CARGO_TERM_COLOR: never
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          cargo test -p vc-cli --no-default-features --features tensorrt --locked --bin vc-rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p vc-cli --no-default-features --features tensorrt --locked --example voicebank_wav_metrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p vc-vst3 --no-default-features --features tensorrt --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/voicebank-benchmark.ps1').Path,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; throw 'Script syntax invalid' }
