<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RVC VoiceBank 設定</title>
<style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#17191d;color:#e8e9ed}body{max-width:850px;margin:24px auto;padding:0 16px}h1{font-size:24px;margin:0 0 8px}h2{font-size:17px}section{background:#22252b;border:1px solid #373b44;border-radius:8px;margin:16px 0;padding:16px}button,select,input{font:inherit}button,select{background:#30343e;color:inherit;border:1px solid #515764;border-radius:5px;padding:8px}button{cursor:pointer}button.active{background:#235b45;border-color:#68bd91}button:disabled{opacity:.5;cursor:default}.voices{display:grid;grid-template-columns:repeat(auto-fit,minmax(106px,1fr));gap:8px}table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;text-align:left;border-bottom:1px solid #383b44}td label{white-space:nowrap;margin-right:8px}code{overflow-wrap:anywhere;color:#b7d1ff}small{color:#a9afbc}#msg{min-height:1.5em;color:#e6c37d}.api{display:grid;grid-template-columns:100px 1fr auto;gap:8px;align-items:center;margin:8px 0}#connection{font-weight:600} @media(max-width:560px){table,tbody,tr,td{display:block}th{display:none}.api{grid-template-columns:1fr auto}.api code{grid-row:2;grid-column:1/-1}}
</style>
<h1>RVC VoiceBank</h1><div id="connection">接続確認中</div><small>Wave Link内のVST3が動作している間のみ操作できます。</small>
<section><h2>キャラクター切替</h2><div class="voices" id="voices"></div><p><small>表示は選択要求の状態です。モデルの実際の読み込み・音声出力はVST3側で確認してください。</small></p></section>
<section><h2>ショートカット設定</h2><label><input type="checkbox" id="enabled"> ショートカット有効</label><table><thead><tr><th>機能</th><th>キー</th><th>修飾キー</th></tr></thead><tbody id="bindings"></tbody></table><p><button id="save">設定を保存</button> <button id="restore">現在の設定を取得</button></p><small>エコーは設定したキーを押している間だけ有効です。変更は保存で反映します。</small></section>
<section><h2>HTTP連携（POST）</h2><small>たぬえさ3などのHTTP送信先に指定してください。引数不要。</small><div id="api"></div></section>
<div id="msg" role="status"></div>
<script>
const names=['元の声','幼児','少女','低音男性','ロボット','エコー（ホールド）'], routes=['original','toddler','girl','male','robot'], modifiers=['Ctrl','Alt','Shift','Win'];
const by=id=>document.getElementById(id), base='http://127.0.0.1:18765';
let keys=[], dirty=false, busy=false, initialized=false;
const offline=location.protocol==='file:';
function fallbackKeys(){const a=[[0,'Disabled']];for(let i=0;i<24;i++)a.push([112+i,'F'+(i+1)]);for(let i=65;i<=90;i++)a.push([i,String.fromCharCode(i)]);return a;}
async function api(path,body){const res=await fetch(path,{method:body===undefined?'GET':'POST',...(body===undefined?{}:{body}),cache:'no-store'});if(!res.ok)throw Error(await res.text());return res.json()}
function msg(text){by('msg').textContent=text}
function selectVoice(n){[...by('voices').children].forEach((b,i)=>{b.classList.toggle('active',i===n);b.setAttribute('aria-pressed',i===n)})}
async function refresh(force=false){if(offline)return;try{if(!keys.length)keys=await api('/api/keys');const s=await api('/api/state');by('connection').textContent='接続中';selectVoice(s.selected);if(force||(!dirty&&!busy&&!initialized)){by('enabled').checked=s.enabled;by('bindings').replaceChildren();s.bindings.forEach(([key,bits],i)=>{const tr=document.createElement('tr'),name=document.createElement('td'),kt=document.createElement('td'),mt=document.createElement('td'),sel=document.createElement('select');name.textContent=names[i];sel.id='k'+i;for(const [value,label] of keys){sel.add(new Option(label,value))}sel.value=key;kt.append(sel);modifiers.forEach((label,j)=>{const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.id='m'+i+'-'+j;c.checked=!!(bits&(1<<j));l.append(c,label);mt.append(l)});tr.append(name,kt,mt);by('bindings').append(tr)});dirty=false;initialized=true}}catch(e){by('connection').textContent='未接続';msg('VST3のHTTP接続を確認してください: '+e.message)}}
routes.forEach((r,i)=>{const b=document.createElement('button');b.textContent=names[i];b.onclick=async()=>{try{const s=await api('/api/voice/'+r,'');selectVoice(s.selected);msg(names[i]+'へ切替を要求しました')}catch(e){msg(e.message)}};by('voices').append(b);const row=document.createElement('div');row.className='api';const label=document.createElement('span');label.textContent=names[i];const code=document.createElement('code');code.textContent=base+'/api/voice/'+r;const copy=document.createElement('button');copy.textContent='コピー';copy.onclick=async()=>{try{await navigator.clipboard.writeText(code.textContent);msg('URLをコピーしました')}catch(e){msg('URLを選択してコピーしてください')}};row.append(label,code,copy);by('api').append(row)});
by('bindings').onchange=by('enabled').onchange=()=>dirty=true;by('restore').onclick=()=>refresh(true);by('save').onclick=async()=>{if(!initialized)return;busy=true;try{const rows=names.map((_,i)=>{let bits=0;modifiers.forEach((_,j)=>{if(by('m'+i+'-'+j).checked)bits|=1<<j});return by('k'+i).value+':'+bits});await api('/api/shortcuts',[by('enabled').checked?'1':'0',...rows].join(';'));dirty=false;msg('保存しました');await refresh(true)}catch(e){msg('保存エラー: '+e.message)}finally{busy=false}};
if(offline){by('connection').textContent='未接続（ローカル表示）';keys=fallbackKeys();by('enabled').checked=true;names.forEach((label,i)=>{const tr=document.createElement('tr'),name=document.createElement('td'),kt=document.createElement('td'),mt=document.createElement('td'),sel=document.createElement('select');name.textContent=label;for(const [value,text] of keys)sel.add(new Option(text,value));sel.value=118+i;sel.disabled=true;kt.append(sel);modifiers.forEach(label=>{const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.disabled=true;l.append(c,label);mt.append(l)});tr.append(name,kt,mt);by('bindings').append(tr)});by('enabled').disabled=true;by('save').disabled=true;by('restore').disabled=true;[...by('voices').children].forEach(b=>b.disabled=true);const link=document.createElement('a');link.href=base+'/control.html';link.target='_blank';link.rel='noopener';link.textContent='Wave Link起動後、接続画面を開く';link.style.color='#b7d1ff';by('connection').after(link);msg('未接続でもHTTP URLと初期ショートカットを確認できます。設定変更は接続画面で行います。')}else{refresh(true);setInterval(()=>{if(!document.hidden&&!busy)refresh()},2000)}
</script></html>
